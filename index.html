عرب",["علم الصرف","علم البيان"]],["التعقيد المعنوي يعرف بعلم:","البيان",["المعاني","النحو"]],["يحتاج طالب البلاغة إلى:","اللغة والصرف والنحو والمعاني والبيان مع سلامة الذوق",["المنطق والكلام فقط","العروض والقافية فقط"]],["ضعف التأليف والتعقيد اللفظي يعرفان بعلم:","النحو",["الصرف","البديع"]],["مع علوم البلاغة يلزم الطالب:","سلامة الذوق وكثرة الاطلاع على كلام العرب",["حفظ الأشعار فقط","معرفة المنطق فقط"]]]],["علم المعاني: تعريفه ومجاله",["علم المعاني هو علم يعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال.","تختلف صور الكلام لاختلاف الأحوال.","يمتاز عن البيان والبديع من جهة البحث في أحوال اللفظ العربي التي بها يطابق مقتضى الحال."],[["تعريف علم المعاني:","علم يعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال",["علم يعرف به الجناس والسجع فقط","علم يعرف به المجاز من حيث القبول فقط"]],["تختلف صور الكلام بسبب:","اختلاف الأحوال",["اختلاف عدد الحروف فقط","اختلاف الأوزان الشعرية فقط"]],["يمتاز علم المعاني بالبحث في:","أحوال اللفظ العربي التي بها يطابق مقتضى الحال",["وجوه تحسين الكلام","إيراد المعنى بطرق مختلفة في الوضوح"]],["يمتاز علم المعاني عن البيان والبديع من جهة:","البحث في أحوال اللفظ التي بها يطابق مقتضى الحال",["البحث في التشبيه والمجاز والكناية","البحث في وجوه تحسين الكلام"]]]],["الباب الأول: الخبر والإنشاء",["كل كلام فهو إما خبر أو إنشاء.","الخبر ما يصح أن يقال لقائله إنه صادق فيه أو كاذب.","الإنشاء ما لا يصح أن يقال لقائله ذلك.","من الإنشاء غير الطلبي التعجب والقسم وصيغ العقود، وقد أعرض الكتاب عن تفصيله لأنه ليس من مباحث علم المعاني هنا."],[["الخبر هو ما:","يصح أن يقال لقائله إنه صادق فيه أو كاذب",["لا يصح أن يقال لقائله ذلك","لا يدل على معنى تام"]],["من أمثلة الإنشاء غير الطلبي:","التعجب والقسم وصيغ العقود",["الاستعارة والكناية","التشبيه والقصر"]],["قول القائل «والله لأفعلن» من الإنشاء:","غير الطلبي",["الطلبي","الخبري"]],["الإنشاء هو ما:","لا يصح أن يقال لقائله إنه صادق فيه أو كاذب",["يصح أن يقال لقائله إنه صادق فيه أو كاذب","يدل على معنى غير تام"]],["كل كلام فهو:","إما خبر أو إنشاء",["إما حقيقة أو مجاز","إما فصيح أو غريب"]],["أعرض الكتاب عن تفصيل الإنشاء غير الطلبي لأنه:","ليس من مباحث علم المعاني",["مجهول المعنى","كثير الغرابة"]]]],["الإنشاء الطلبي: الأمر والنهي والاستفهام والتمني والنداء",["الإنشاء إما طلبي أو غير طلبي. الطلبي ما يستدعي مطلوباً غير حاصل وقت الطلب، وغير الطلبي ما ليس كذلك.","غير الطلبي ليس من مباحث علم المعاني، ولذا لم يتعرض له المصنف هنا.","الطلبي يكون بخمسة أشياء: الأمر، والنهي، والاستفهام، والتمني، والنداء.","الأمر طلب الفعل على وجه الاستعلاء، وله أربع صيغ.","النداء طلب الإقبال بحرف نائب مناب «أدعو»، وقد يخرج عن معناه الأصلي لمعانٍ أخرى تفهم من السياق."],[["الإنشاء الطلبي هو ما يستدعي:","مطلوباً غير حاصل وقت الطلب",["مطلوباً حاصلاً وقت الطلب","خبراً يحتمل الصدق والكذب"]],["الأمر هو:","طلب الفعل على وجه الاستعلاء",["طلب الكف عن الفعل على وجه الاستعلاء","طلب الإقبال بحرف نائب مناب أدعو"]],["أنواع الإنشاء الطلبي:","الأمر والنهي والاستفهام والتمني والنداء",["الأمر والنهي والقصر والوصل","التشبيه والاستعارة والكناية"]],["عدد صيغ الأمر:","أربع",["خمس","صيغة واحدة"]],["النداء طلب الإقبال بحرف نائب مناب:","أدعو",["أطلب","أسأل"]],["قسما الإنشاء:","طلبي وغير طلبي",["حقيقي وإضافي","إفراد وقلب"]]]],["الإنشاء الطلبي (٢): النهي والاستفهام والأغراض البلاغية",["النهي طلب الكف عن الفعل على وجه الاستعلاء، وله صيغة واحدة هي المضارع مع «لا» الناهية، كقوله تعالى: ﴿وَلَا تُفْسِدُوا فِي الْأَرْضِ﴾.","تخرج صيغة النهي عن معناها الأصلي إلى الدعاء والالتماس (لمن يساويك) والتمني (كقول الشاعر: يا صبح قف لا تطلع) والتهديد (كقولك لخادمك: لا تطع أمري).","الاستفهام طلب العلم بشيء، وأدواته: الهمزة، وهل، وما، ومن، ومتى، وأيان، وكيف، وأين، وأنى، وكم، وأي.","الهمزة لطلب التصور أو التصديق، والتصور هو إدراك المفرد.","تخرج ألفاظ الاستفهام لمعانٍ أخرى تفهم من السياق: كالتسوية في ﴿سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ﴾، والنفي في ﴿هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ﴾.","وتخرج صيغة الأمر لمعانٍ أخرى: كالدعاء والالتماس والتخيير والتسوية والإكرام (﴿ادْخُلُوهَا بِسَلَامٍ﴾) والتعجيز والإهانة (﴿كُونُوا حِجَارَةً أَوْ حَدِيدًا﴾) والتهديد."],[["صيغة النهي الوحيدة هي:","المضارع المقرون بلا الناهية",["المضارع المقرون بلام الأمر","اسم فعل الأمر الدال على الكف","المصدر النائب عن فعل النهي"]],["قول الشاعر «يا صبح قف لا تطلع» خرج فيه النهي إلى:","التمني",["الدعاء","الالتماس","التهديد"]],["﴿سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ﴾ خرج فيه الاستفهام إلى:","التسوية",["النفي","التعجيز","الإنكار"]],["الأداة التي تختص بطلب التصديق من بين الأدوات الآتية:","هل",["الهمزة","ما","من"]],["﴿كُونُوا حِجَارَةً أَوْ حَدِيدًا﴾ خرج فيه الأمر إلى:","الإهانة",["التعجيز","التهديد","الإكرام"]],["التصور هو:","إدراك المفرد",["الحكم بثبوت النسبة","إدراك النسبة بين المفردين"]],["﴿هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ﴾ خرج فيه الاستفهام إلى:","النفي",["التسوية","التعجيز"]],["قولك لمن يساويك «لا تبرح من مكانك» خرج فيه النهي إلى:","الالتماس",["الدعاء","التهديد"]],["الاستفهام هو:","طلب العلم بشيء",["طلب الفعل على وجه الاستعلاء","طلب الكف عن الفعل"]],["النهي هو:","طلب الكف عن الفعل على وجه الاستعلاء",["طلب الفعل على وجه الاستعلاء","طلب الإقبال بحرف نائب"]]]],["الباب الثاني: الذكر والحذف",["يبحث الباب الثاني في الذكر والحذف ومواضع كل منهما بحسب المقام.","الحذف ليس مجرد اختصار، بل يراعى فيه ما يترتب عليه من فائدة وما يدل على المحذوف من قرينة."],[["موضوع الباب الثاني:","الذكر والحذف",["التشبيه والاستعارة","الجناس والسجع"]],["الحذف البلاغي يتعلق بـ:","الفائدة التي يقتضيها المقام مع دلالة القرينة",["الاختصار وحده","إفساد المعنى"]],["الحذف عند البلاغيين ليس مجرد:","اختصار",["فائدة","قرينة"]],["يشترط لصحة الحذف وجود:","قرينة تدل على المحذوف",["تقييد في الجملة","نفي في الكلام"]],["يراعى في الحذف:","ما يترتب عليه من فائدة وما يدل على المحذوف من قرينة",["الاختصار دون نظر إلى الفائدة","موافقة القياس الصرفي"]],["يبحث الباب الثاني في الذكر والحذف و:","مواضع كل منهما بحسب المقام",["أقسام التشبيه","طرق القصر"]]]],["الباب الثالث: التقديم والتأخير",["من أغراض التقديم والتأخير التخصيص، مثل «ما أنا قلت» و«إياك نعبد».","ومن دواعيه المحافظة على وزن أو سجع في الكلام."],[["تقديم المفعول في «إياك نعبد» يفيد:","التخصيص وقصر العبادة على المخاطب",["الترتيب الزمني","إخفاء الفاعل"]],["من دواعي التقديم والتأخير:","المحافظة على الوزن أو السجع",["تعريف الكلمة","إثبات الغرابة"]],["«ما أنا قلت» يفيد التقديم فيه:","التخصيص",["المحافظة على الوزن","المحافظة على السجع"]]]],["الباب الرابع: التعريف والتنكير",["التعريف والتنكير من صور اللفظ التي تختلف باختلاف الأحوال.","من أغراض التنكير الدلالة على الوحدة شخصاً أو نوعاً.","ومن أغراضه إخفاء الأمر، مثل «قال رجل إنك انحرفت عن الصواب» لإخفاء الاسم حتى لا يلحقه أذى."],[["من أغراض التنكير:","إخفاء الأمر والدلالة على الوحدة شخصاً أو نوعاً",["إثبات السجع فقط","قصر المعنى على شخص معلوم دائماً"]],["«قال رجل» نكّر فيه رجل لأجل:","إخفاء اسمه حتى لا يلحقه أذى",["تعيينه للمخاطب","المبالغة في المدح"]],["التعريف والتنكير من صور اللفظ التي:","تختلف باختلاف الأحوال",["لا تتغير بتغير المقام","تختص بالمجاز"]],["الدلالة على الوحدة في التنكير تكون:","شخصاً أو نوعاً",["جنساً فقط","عموماً فقط"]]]],["الباب الخامس: الإطلاق والتقييد",["إذا اقتصر في الجملة على ذكر المسند والمسند إليه فالحكم مطلق، وإذا زيد عليهما شيء مما يتعلق بهما أو بأحدهما فالحكم مقيد.","الإطلاق حيث لا يتعلق الغرض بتقييد الحكم، والتقييد حيث تفوت الفائدة المطلوبة لو لم يراع القيد.","من وجوه التقييد المفاعيل والنواسخ والشرط والنفي والتوابع وغير ذلك."],[["الحكم يكون مطلقاً إذا:","اقتصر في الجملة على ذكر المسند والمسند إليه",["ذكر معه شرط ونفي","قدم المفعول فقط"]],["التقييد يكون حيث:","تفوت الفائدة المطلوبة إذا لم يراع القيد",["لا توجد فائدة في القيد","يكون القصد إلى الإيجاز فقط"]],["يكون الحكم مقيداً إذا:","زيد على المسند والمسند إليه شيء مما يتعلق بهما أو بأحدهما",["اقتصر على المسند والمسند إليه","حذف المسند إليه"]],["من وجوه التقييد:","المفاعيل والنواسخ والشرط والنفي والتوابع",["الاستعارة والكناية والتشبيه","الوصل والفصل والقصر"]]]],["الباب السادس: القصر",["القصر تخصيص شيء بشيء بطريق مخصوص، وينقسم إلى حقيقي وإضافي.","الحقيقي اختصاص بحسب الواقع والحقيقة، والإضافي اختصاص بحسب الإضافة إلى شيء معين.","من طرق القصر النفي والاستثناء، وإنّما، والعطف بلا أو بل أو لكن، وتقديم ما حقه التأخير."],[["القصر هو:","تخصيص شيء بشيء بطريق مخصوص",["إثبات صفة بلا قيد","حذف المسند إليه"]],["من طرق القصر:","النفي والاستثناء وإنّما والعطف والتقديم",["التعجب والقسم فقط","التشبيه والكناية فقط"]],["ينقسم القصر إلى:","حقيقي وإضافي",["إفراد وقلب","ذكر وحذف"]],["القصر الإضافي هو اختصاص:","بحسب الإضافة إلى شيء معين",["بحسب الواقع والحقيقة","بالعطف بالواو"]],["من طرق القصر العطف بـ:","لا أو بل أو لكن",["الواو والفاء","ثم وحتى"]]]],["الباب السادس (تتمة): قصر الإفراد والقلب والتعيين",["من أقسام القصر الإضافي: قصر إفراد، وقصر قلب، وقصر تعيين.","قصر القلب إذا اعتقد المخاطب عكس الحكم الذي أثبته المتكلم.","قصر التعيين إذا كان المخاطب متردداً في تعيين أحد الأمرين."],[["قصر القلب يكون إذا:","اعتقد المخاطب عكس الحكم الذي أثبته المتكلم",["كان المخاطب لا يعرف أي الأمرين","كان القصر حقيقياً مطلقاً"]],["قصر التعيين يكون إذا:","كان المخاطب متردداً في تعيين أحد الأمرين",["اعتقد عكس الحكم","لم يوجد تخصيص أصلاً"]],["قصر الإفراد يكون إذا اعتقد المخاطب:","الشركة في الحكم",["عكس الحكم","التردد في التعيين"]],["أقسام القصر الإضافي:","إفراد وقلب وتعيين",["إفراد وتمثيل وتعيين","قلب وتحقيق وتعيين"]],["الفرق بين قصر القلب وقصر التعيين أن المخاطب في القلب:","يعتقد عكس الحكم",["يتردد في التعيين","لا يعرف الحكم أصلاً"]]]],["الباب السابع: الوصل والفصل",["الوصل عطف جملة على أخرى، والفصل تركه، والبحث هنا مقصور على العطف بالواو.","خص الواو بالبحث لأن غيرها من حروف العطف لها معان محصلة سوى الاشتراك، أما الواو فلا تفيد إلا مجرد الاشتراك.","ذكر الشرح خمسة أحوال بين الجمل: كمال الانقطاع وشبهه، وكمال الاتصال وشبهه، والتوسط بين الكمالين."],[["الوصل هو:","عطف جملة على أخرى",["حذف جملة","تقديم الجملة الثانية"]],["البحث في هذا الباب مقصور على:","العطف بالواو",["العطف ببل فقط","النداء والقسم"]],["خص الواو بالبحث لأنها:","لا تفيد إلا مجرد الاشتراك",["أكثر حروف العطف استعمالاً فقط","تفيد الترتيب والتعقيب"]],["الفصل هو:","ترك العطف",["العطف بغير الواو","حذف الجملة الثانية"]],["الأحوال بين الجمل في الشرح:","كمال الانقطاع وشبهه وكمال الاتصال وشبهه والتوسط بين الكمالين",["الإفراد والقلب والتعيين","الإيجاز والإطناب والمساواة"]]]],["الباب الثامن: الإيجاز والإطناب والمساواة",["يمكن التعبير عن المعنى بثلاث طرق: المساواة والإيجاز والإطناب.","المساواة تأدية المعنى المراد بعبارة مساوية على الحد الذي جرى به عرف أوساط الناس.","للكتاب بعد ذلك أقسام للإيجاز وأقسام للإطناب."],[["المساواة هي:","تأدية المعنى المراد بعبارة مساوية على الحد المعتاد",["تأدية المعنى بأقصر عبارة دائماً","زيادة الألفاظ على المعنى"]],["طرق التعبير عن المعنى المذكورة هنا ثلاثة، منها:","المساواة والإيجاز والإطناب",["القصر والتنكير والوصل","التشبيه والاستعارة والكناية"]],["الإيجاز هو:","تأدية المعنى بعبارة ناقصة عنه مع وفائها بالغرض",["تأدية المعنى بعبارة مساوية له","زيادة اللفظ على المعنى لفائدة"]],["إذا لم تف العبارة الناقصة بالغرض سمي ذلك:","إخلالاً",["تطويلاً","حشواً"]],["المساواة تكون على الحد الذي جرى به عرف:","أوساط الناس",["البلغاء خاصة","العلماء خاصة"]]]],["الخاتمة: خلاف مقتضى الظاهر",["إيراد الكلام على القواعد السابقة يسمى إخراج الكلام على مقتضى ظاهر الحال، وقد تقتضي الأحوال العدول عنه.","منه تنزيل العالم بفائدة الخبر منزلة الجاهل بها لعدم جريه على موجب علمه.","ومن أنواعه الالتفات، وتجاهل العارف، وأسلوب الحكيم، كما يشرح الكتاب."],[["من أمثلة خلاف مقتضى الظاهر:","تنزيل العالم بفائدة الخبر منزلة الجاهل بها",["إلغاء مقتضى الحال دائماً","ترك الفصاحة في الكلام"]],["من أنواع الخاتمة المذكورة:","الالتفات وتجاهل العارف وأسلوب الحكيم",["الجناس والسجع فقط","الحد والاستقراء"]],["إيراد الكلام على القواعد السابقة يسمى:","إخراج الكلام على مقتضى ظاهر الحال",["إخراج الكلام على خلاف مقتضى الظاهر","إخراج الكلام على سبيل المجاز"]],["سبب تنزيل العالم منزلة الجاهل:","عدم جريه على موجب علمه",["كثرة جهله بالخبر","اختلاف الأحوال"]]]],["علم البيان والتشبيه",["يبحث علم البيان في التشبيه والمجاز والكناية، وعُرّف أيضاً بأنه قواعد يعرف بها إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه.","إذا حذفت أداة التشبيه ووجهه سمي تشبيهاً بليغاً، وفيه مبالغة في التشبيه.","من أمثلة الشرح: «زيد كالبحر في السخا»، ثم «زيد كالبحر»، ثم «زيد بحر»، وتختلف هذه الصور في الوضوح."],[["المباحث الأصلية لعلم البيان:","التشبيه والمجاز والكناية",["الخبر والقصر والذكر","الجناس والسجع فقط"]],["أوضح الصور الثلاث في مثال الشرح:","زيد كالبحر في السخا",["زيد كالبحر","زيد بحر"]],["عرف البيان بأنه قواعد يعرف بها:","إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه",["مطابقة الكلام لمقتضى الحال","وجوه تحسين الكلام"]]]],["التشبيه: الأركان والأقسام والأغراض",["أركان التشبيه أربعة: المشبه والمشبه به (طرفا التشبيه)، وأداة التشبيه، ووجه الشبه.","وجه الشبه هو الوصف الخاص الذي قصد اشتراك الطرفين فيه، كالهداية في العلم والنور.","يذكر في التشبيه الأداة فيسمى مرسلاً، وتحذف فيسمى مؤكداً؛ ويحذف الوجه فيسمى مجملاً، ويذكر فيسمى مفصلاً.","التشبيه البليغ ما حذفت أداته ووجهه معاً.","من أغراض التشبيه: بيان إمكان المشبه، وبيان حاله، وبيان مقدار حاله، وتقرير حاله، وتزيينه أو تقبيحه."],[["أركان التشبيه:","المشبه والمشبه به والأداة ووجه الشبه",["المستعار له والمستعار منه والقرينة","الحال ومقتضى الحال والمقام"]],["التشبيه البليغ ما حذف فيه:","الأداة ووجه الشبه معاً",["الأداة فقط","المشبه به"]],["وجه الشبه هو:","الوصف الخاص الذي قصد اشتراك الطرفين فيه",["اللفظ الدال على المشاركة","الأمر الحامل على الصورة المخصوصة"]],["من أغراض التشبيه:","بيان إمكان المشبه وبيان حاله وبيان مقدار حاله",["بيان وزن الكلام","إثبات القافية"]],["التشبيه المجمل ما حذف منه:","وجه الشبه",["الأداة","المشبه به"]],["التشبيه في «زيد كالبحر في السخا»:","مرسل مفصل",["مؤكد مجمل","بليغ"]]]],["المجاز والاستعارة والكناية",["يتضمن ترتيب الكتاب بعد التشبيه: المجاز والاستعارة، ثم المجاز المرسل والمركب والعقلي، ثم الكناية.","الاستعارة التمثيلية تستعمل الصورة المركبة المشبه بها في الصورة المشبهة للمبالغة وادعاء دخول الصورة العقلية في جنس الصورة الحسية.","من أمثلة الكناية المذكورة «سكب الدموع» عن الحزن، مع بحث مناسبة الكناية وسرعة فهم اللازم."],[["الاستعارة التمثيلية تتعلق بـ:","استعمال صورة مركبة مشبه بها في صورة مشبهة للمبالغة",["الطباق بين لفظين","حذف المعنى المقصود"]],["من أمثلة الكناية:","سكب الدموع عن الحزن",["جمود الدموع عن الحزن دائماً","البحر عن العلم"]],["ترتيب الكتاب بعد التشبيه:","المجاز والاستعارة ثم المجاز المرسل والمركب والعقلي ثم الكناية",["الكناية ثم المجاز العقلي ثم الاستعارة","الاستعارة ثم الجناس ثم الكناية"]],["الاستعارة التمثيلية فيها ادعاء دخول:","الصورة العقلية في جنس الصورة الحسية",["المشبه به في المشبه","اللفظ في المعنى"]]]],["المجاز المرسل والمجاز العقلي",["المجاز المرسل يذكره الكتاب بعد الاستعارة، ثم المجاز المركب والمجاز العقلي.","المجاز العقلي هو إسناد الفعل أو ما في معناه إلى غير ما هو له عند المتكلم في الظاهر لعلاقة.","من مثال الكتاب «أشاب الصغير وأفنى الكبير كر الغداة ومر العشي»، فأسند الإشابة والإفناء إلى كر الغداة ومر العشي."],[["تعريف المجاز العقلي:","إسناد الفعل أو ما في معناه إلى غير ما هو له عند المتكلم في الظاهر لعلاقة",["حذف أداة التشبيه ووجهه","تأدية المعنى بعبارة مساوية"]],["في المثال المذكور أُسند الفعل إلى:","كر الغداة ومر العشي",["الصغير والكبير","المتكلم"]],["المجاز المرسل يذكره الكتاب بعد:","الاستعارة",["الكناية","التشبيه"]],["الفاعل الحقيقي للإشابة والإفناء في المثال:","الله تعالى",["كر الغداة","الصغير والكبير"]]]],["علم البديع: المحسنات المعنوية",["يشتمل علم البديع على محسنات معنوية ومحسنات لفظية.","من المعنوية: التورية والإبهام والتوجيه والطباق والمقابلة والتدبيج والإدماج والاستتباع ومراعاة النظير والاستخدام والاستطراد والافتتان والجمع والتفريق والتقسيم والطي والنشر وإرسال المثل والمبالغة والمغائرة وتأكيد المدح بما يشبه الذم وتأكيد الذم بما يشبه المدح والتجريد وحسن التعليل.","حسن التعليل دعوى علة غير حقيقية لوصف فيها غرابة بحيث لا يدرك كونها علة إلا من له تصرف في دقائق المعاني."],[["حسن التعليل هو:","دعوى علة غير حقيقية لوصف مع غرابة فيها",["ذكر العلة الحقيقية فقط","حذف العلة من الكلام"]],["من المحسنات المعنوية:","الطباق والمقابلة والتورية وحسن التعليل",["الجناس والسجع فقط","الإيجاز والقصر فقط"]],["التورية ذكر لفظ له معنيان:","قريب متبادر وبعيد هو المراد",["قريبان متساويان","بعيد متبادر وقريب هو المراد"]],["المقابلة أن يؤتى بمعنيين أو أكثر ثم:","بما يقابل ذلك على الترتيب",["بما يشابه ذلك دون ترتيب","بحذف أحدهما"]]]],["علم البديع: المحسنات اللفظية والخاتمة",["يبدأ الكتاب المحسنات اللفظية بتشابه الأطراف ثم الجناس، ثم يذكر التصدير والسجع والقلب والعكس والتشريع والمواربة وائتلاف.","تشابه الأطراف جعل آخر جملة صدر تاليتها، أو آخر بيت صدر ما يليه.","تختم الفنون بسرقة الكلام والاقتباس والتضمين والعقد والحل والتلميح وحسن الابتداء وحسن التخلص وبراعة الطلب وحسن الانتهاء."],[["تشابه الأطراف هو:","جعل آخر جملة صدر تاليتها أو آخر بيت صدر ما يليه",["جمع معنيين متضادين","حذف أداة التشبيه"]],["من موضوعات خاتمة الكتاب:","الاقتباس والتضمين وحسن الابتداء وحسن الانتهاء",["القصر والتقديم والتأخير","أقسام التشبيه فقط"]],["السجع هو توافق الفاصلتين:","نثراً في الحرف الأخير",["شعراً في الوزن","نثراً في الحرف الأول"]],["الجناس هو تشابه اللفظين:","في النطق لا في المعنى",["في المعنى لا في النطق","في النطق والمعنى معاً"]],["الاقتباس أن يضمن الكلام شيئاً من:","القرآن أو الحديث لا على أنه منه",["شعر الغير","أقوال الحكماء"]]]]];
const BALDEFS=[["الْفَصَاحَةُ","وَصْفٌ لِلْكَلِمَةِ وَالْكَلَامِ وَالْمُتَكَلِّمِ بِمَعَانٍ مَخْصُوصَةٍ فِي كُلِّ وَاحِدٍ","Fasāḥah: eloquence/clarity, applied differently to word, speech, and speaker."],["فَصَاحَةُ الْكَلِمَةِ","سَلَامَتُهَا مِنْ تَنَافُرِ الْحُرُوفِ وَمُخَالَفَةِ الْقِيَاسِ وَالْغَرَابَةِ","Word-level eloquence: freedom from letter-clash, deviation from analogy, and unfamiliarity."],["فَصَاحَةُ الْكَلَامِ","سَلَامَتُهُ مِنْ تَنَافُرِ الْكَلِمَاتِ وَضَعْفِ التَّأْلِيفِ وَالتَّعْقِيدِ مَعَ فَصَاحَةِ كَلِمَاتِهِ","Speech-level eloquence: freedom from word-clash, weak composition, and complexity."],["فَصَاحَةُ الْمُتَكَلِّمِ","مَلَكَةٌ يَقْتَدِرُ بِهَا عَلَى التَّعْبِيرِ عَنِ الْمَقْصُودِ بِكَلَامٍ فَصِيحٍ فِي أَيِّ غَرَضٍ كَانَ","A faculty enabling eloquent expression for any purpose."],["الْبَلَاغَةُ","مُطَابَقَةُ الْكَلَامِ لِمُقْتَضَى الْحَالِ مَعَ فَصَاحَتِهِ","Conformity of speech to the requirements of the situation with eloquence."],["الْحَالُ","الْأَمْرُ الْحَامِلُ لِلْمُتَكَلِّمِ عَلَى إِيرَادِ عِبَارَتِهِ عَلَى صُورَةٍ مَخْصُوصَةٍ","The situation that leads the speaker to a particular form."],["مُقْتَضَى الْحَالِ","الصُّورَةُ الْمَخْصُوصَةُ الَّتِي تُورَدُ عَلَيْهَا الْعِبَارَةُ","The particular form in which the expression is presented."],["عِلْمُ الْمَعَانِي","عِلْمٌ يُعْرَفُ بِهِ أَحْوَالُ اللَّفْظِ الْعَرَبِيِّ الَّتِي بِهَا يُطَابِقُ مُقْتَضَى الْحَالِ","The science of Arabic expression as it conforms to context."],["الْخَبَرُ","مَا يَصِحُّ أَنْ يُقَالَ لِقَائِلِهِ إِنَّهُ صَادِقٌ فِيهِ أَوْ كَاذِبٌ","An utterance that can be judged true or false."],["الْإِنْشَاءُ","مَا لَا يَصِحُّ أَنْ يُقَالَ لِقَائِلِهِ ذَلِكَ","An utterance not subject to that true/false judgment."],["الْقَصْرُ","تَخْصِيصُ شَيْءٍ بِشَيْءٍ بِطَرِيقٍ مَخْصُوصٍ","Restriction of one thing to another through a specified method."],["الوصل","عطف جملة على أخرى","Joining one sentence to another."],["الفصل","ترك عطف جملة على أخرى","Leaving one sentence unjoined to another."],["المساواة","تأدية المعنى المراد بعبارة مساوية على الحد المعتاد","Expressing the intended meaning with an ordinary proportion of wording."],["التشبيه البليغ","حذف أداة التشبيه ووجهه","A simile with its particle and aspect of resemblance omitted."],["المجاز العقلي","إسناد الفعل أو ما في معناه إلى غير ما هو له عند المتكلم في الظاهر لعلاقة","Attributing an action to something other than its apparent proper bearer through a relation."],["حسن التعليل","دعوى علة غير حقيقية لوصف مع غرابة فيها","Giving a rhetorically subtle non-real cause for a quality."],["الْإِنْشَاءُ الطَّلَبِيُّ","مَا يَسْتَدْعِي مَطْلُوبًا غَيْرَ حَاصِلٍ وَقْتَ الطَّلَبِ","An imperative-type utterance that seeks something not yet obtained."],["الْإِنْشَاءُ غَيْرُ الطَّلَبِيِّ","مَا لَا يَسْتَدْعِي مَطْلُوبًا غَيْرَ حَاصِلٍ وَقْتَ الطَّلَبِ","An utterance that seeks nothing unobtained (not studied in ‘ilm al-ma‘ānī)."],["الْأَمْرُ","طَلَبُ الْفِعْلِ عَلَى وَجْهِ الِاسْتِعْلَاءِ","Seeking an action from a position of superiority."],["النِّدَاءُ","طَلَبُ الْإِقْبَالِ بِحَرْفٍ نَائِبٍ مَنَابَ أَدْعُو","Seeking attention with a particle standing in for ‘I call’."],["التَّطْوِيلُ","الزِّيَادَةُ عَلَى أَصْلِ الْمُرَادِ بِلَا فَائِدَةٍ وَالزَّائِدُ غَيْرُ مُتَعَيَّنٍ","Excess over the intended meaning with no benefit, the excess not identifiable."],["الْحَشْوُ","الزِّيَادَةُ عَلَى أَصْلِ الْمُرَادِ بِلَا فَائِدَةٍ وَالزَّائِدُ مُتَعَيَّنٌ","Excess with no benefit, where the excess is identifiable."],["الْإِيجَازُ","تَأْدِيَةُ الْمَعْنَى بِعِبَارَةٍ نَاقِصَةٍ عَنْهُ مَعَ وَفَائِهَا بِالْغَرَضِ","Conveying the meaning in fewer words while still fulfilling the purpose."],["الإخلال","الإيجاز الذي لا تفي عبارته بالغرض","Brevity that fails to fulfil the purpose."],["علم البيان","علم يبحث فيه عن التشبيه والمجاز والكناية","The science that studies simile, figurative usage and metonymy."],["التشبيه","الدلالة على مشاركة أمر لآخر في معنى","Indicating that one thing shares a quality with another."],["وجه الشبه","الوصف الخاص الذي قصد اشتراك الطرفين فيه","The specific quality both sides are meant to share."],["أداة التشبيه","اللفظ الدال على المشاركة","The word indicating the sharing."],["التشبيه المرسل","التشبيه الذي ذكرت فيه الأداة","A simile in which the particle is stated."],["التشبيه المؤكد","التشبيه الذي حذفت منه الأداة","A simile in which the particle is dropped."],["التشبيه المجمل","التشبيه الذي حذف منه وجه الشبه","A simile in which the shared quality is dropped."],["التشبيه المفصل","التشبيه الذي ذكر فيه وجه الشبه","A simile in which the shared quality is stated."],["المجاز","اللفظ المستعمل في غير ما وضع له لعلاقة مع قرينة مانعة من إرادة المعنى الأصلي","A word used for other than its set meaning, with a link and a preventing indication."],["الاستعارة","مجاز علاقته المشابهة دائماً","A figurative usage whose link is always resemblance."],["المستعار له","المشبه","The thing for which the word is borrowed (the likened)."],["المستعار منه","المشبه به","The thing from which the word is borrowed (the likened-to)."],["الاستعارة التصريحية","ما صرح فيها بلفظ المشبه به","Metaphor in which the likened-to is stated."],["الاستعارة المكنية","ما حذف فيها المشبه به ورمز إليه بشيء من لوازمه","Metaphor in which the likened-to is dropped and hinted at by one of its attributes."],["المجاز المرسل","مجاز علاقته غير المشابهة","A figurative usage whose link is anything other than resemblance."],["الكناية","لفظ أريد به لازم معناه مع جواز إرادة ذلك المعنى","A word meant for what its meaning entails, while its own meaning remains possible."],["علم البديع","علم يعرف به وجوه تحسين الكلام بعد رعاية المطابقة ووضوح الدلالة","The science of the ways of embellishing speech, after suitability and clarity."],["الطباق","الجمع بين معنيين متقابلين","Combining two opposite meanings."],["المقابلة","أن يؤتى بمعنيين أو أكثر ثم يؤتى بما يقابل ذلك على الترتيب","Giving two or more meanings, then their opposites in order."],["التورية","أن يذكر لفظ له معنيان قريب يتبادر فهمه وبعيد هو المراد بقرينة خفية","A word with a near, obvious meaning and a far one that is intended by a hidden clue."],["التوجيه (الإبهام)","إيراد الكلام محتملاً لوجهين متضادين على السواء","Speech that equally allows two opposite readings."],["الاستخدام","ذكر اللفظ بمعنى وإعادة ضمير عليه بمعنى آخر","Mentioning a word in one sense and its pronoun in another."],["التفريق","أن يفرق بين شيئين من نوع واحد","Distinguishing two things of the same kind."],["التقسيم","استيفاء أقسام الشيء","Exhausting the parts of a thing."],["الاستطراد","أن يخرج المتكلم من الغرض الذي هو فيه إلى آخر لمناسبة ثم يرجع إلى الأول","Digressing to another purpose for a link, then returning."],["العكس","أن يقدم جزء في الكلام على آخر ثم يعكس","Putting one part before another, then reversing them."],["المبالغة","ادعاء بلوغ وصف في الشدة أو الضعف حداً يبعد أو يستحيل","Claiming a quality reaches an improbable or impossible extent."],["الالتفات","نقل الكلام من حالة التكلم أو الخطاب أو الغيبة إلى حالة أخرى منها","Shifting speech between first, second and third person."],["التجريد","أن ينتزع من أمر ذي صفة أمر آخر مثله فيها","Extracting from a thing with a quality another like it in that quality."],["الاقتباس","أن يضمن الكلام شيئاً من القرآن أو الحديث لا على أنه منه","Embedding Qur’an or ḥadīth in speech without presenting it as such."],["الجناس","تشابه اللفظين في النطق لا في المعنى","Two words alike in pronunciation but not meaning."],["السجع","توافق الفاصلتين نثراً في الحرف الأخير","Two prose clauses agreeing in their last letter."],["تأكيد المدح بما يشبه الذم","أن يستثنى من صفة ذم منفية عن الشيء صفة مدح على تقدير دخولها فيها","Excepting a praise from a negated fault, as if it were included."],["تأكيد الذم بما يشبه المدح","أن يستثنى من صفة مدح منفية عن الشيء صفة ذم على تقدير دخولها فيها","Excepting a fault from a negated praise, as if it were included."],["اللف والنشر","ذكر متعدد ثم ذكر ما لكل واحد من غير تعيين اعتماداً على فهم السامع","Naming several things, then what belongs to each, leaving the matching to the listener."],["الجمع","أن يجمع بين متعدد تحت حكم واحد","Placing several things under one ruling."],["مراعاة النظير","الجمع بين أمر وما يناسبه لا بالتضاد","Combining a thing with what suits it, not by opposition."],["التضمين","أن يضمن الشعر أو النثر شيئاً من شعر الغير","Embedding part of another’s verse in one’s own."],["حسن الابتداء","أن يأتي المتكلم في أول كلامه بما يلائم المقصود ويدل عليه","Opening speech with what suits and points to the aim."],["براعة الاستهلال","أن يشتمل ابتداء الكلام على ما يناسب المقصود","An opening that already hints at the subject."],["حسن الانتهاء","أن يجعل آخر الكلام عذباً حسن الموقع","Ending speech pleasantly and fittingly."],["رد العجز على الصدر","أن يجعل أحد اللفظين المكررين أو المتجانسين في أول الفقرة والآخر في آخرها","Placing one of two repeated or alike words at the start of a phrase and the other at its end."],["تجاهل العارف","سوق المعلوم مساق غيره لنكتة","Presenting what is known as if unknown, for a purpose."],["أسلوب الحكيم","تلقي المخاطب بغير ما يترقب","Answering the addressee with other than what he expects."]];
let currentBook=localStorage.getItem('studyBook')||'tahdhib';
const BOOKS={tahdhib:{name:'Sharḥ Tahdhīb al-Manṭiq',L:L,defs:DEF,done:done},balaghah:{name:'Durūs al-Balāghah',L:BALAGHAH,defs:BALDEFS,done:(()=>{try{return JSON.parse(localStorage.getItem('sbal')||'{}')}catch(e){return {}}})()}};
function saveBook(){try{localStorage.setItem(currentBook==='balaghah'?'sbal':'sth',JSON.stringify(BOOKS[currentBook].done))}catch(e){}}
function mixChoices(q,k){const b=BOOKS[currentBook],c=q[1],n=c.length,words=t=>new Set(t.split(' ')),ov=(a,z)=>{const A=words(a),Z=words(z);let i=0;A.forEach(w=>Z.has(w)&&i++);return i/Math.max(A.size,Z.size)};
const cand=[];b.L.forEach((l,j)=>(l[2]||[]).forEach(x=>{if(x===q)return;const d=Math.abs(j-k);cand.push([x[1],d]);x[2].forEach(w=>cand.push([w,d+1.5]))}));
const okc=cand.filter(([t])=>t!==c&&ov(t,c)<.5),enc=okc.filter(([t])=>ENG[t]),sc=(enc.length>=6?enc:okc).map(([t,d])=>[t,d+Math.abs(Math.log(t.length/n))*6]).sort((a,z)=>a[1]-z[1]),pool=[];
for(const [t] of sc){if(!pool.includes(t))pool.push(t);if(pool.length>=7)break}
const pick=sh(pool.slice(0,6)).slice(0,3);
if(!pick.some(t=>t.length>n)){const lg=pool.find(t=>t.length>n&&!pick.includes(t));if(lg)pick[0]=lg}
return pick}
const TEACH={"tahdhib":[["The author starts the book with Bismillah and then praise. Two ḥadīths seem to ask for different openings, so the commentary shows both are satisfied.",["In writing, the alif of ‹بسم› is dropped because it is used so often, and the bā’ is stretched to make up for it.","Ḥadīth 1: an important matter not begun with Allah’s name is ‹أقطع› (cut off). Ḥadīth 2: speech not begun with ḥamd is ‹أجذم› (maimed).","Solution: the Basmala is the true beginning (nothing comes before it). The ḥamd is a relative or customary beginning (it comes before the aim of the book).","‹الحمد› is praise by the tongue for a beautiful voluntary act, whether a favour or another virtue."],[["f",["Book opens","‹بسم الله› = the TRUE beginning (nothing before it)","‹الحمد لله› = a RELATIVE beginning (before the aim)","Then the subject of the book"]]],"Both ḥadīths are satisfied because ‘beginning’ has two senses."],["‹الحمد لله› says: all praise belongs to Allah alone. The sentence carries its own proof inside it.",["‹الله› is a proper name for the Necessary Being who has every perfection.","‹ال› on ‹الحمد› means ‘all praise’; the ‹لام› of ‹لله› means ‘belongs only to’.","The proof is a first-figure syllogism, shown below. It is self-evident (fiṭrī), like ‘four is even’.","If ‹الله› only named a universal idea, ‘no god but Allah’ would not prove oneness, so it names one real individual."],[["f",["Praise is a perfection","Perfection belongs only to the One who has all perfections","So all praise is for Allah alone"]]],"A claim with its proof built into the words."],["Hidāya (‘guidance’) has two famous meanings. The author says the word covers both.",["Mu‘tazila: hidāya = actually delivering to the goal, so it happens only for believers.","Ash‘aris: hidāya = showing the way, so it can be for anyone.","Each is challenged by a verse (see below), so the author says hidāya is a homonym covering both.","‹سواء الطريق› = the middle of the road = the straight path. It hints at the book’s subject (logic and kalām), a style called ‹براعة الاستهلال›."],[["c",[["Delivering (Mu‘tazila)","Arrives at the goal. Challenge: ‘As for Thamūd, We guided them but they preferred blindness’"],["Showing (Ash‘ari)","Any listener can be shown. Challenge: ‘You cannot guide whom you love’"]]]],"The author’s answer: hidāya is a homonym."],["This section thanks Allah for tawfīq and sends blessings on the Prophet ﷺ.",["Tawfīq = steering the causes toward a good goal; some say it is creating the power to obey.","‹الصلاة› = du‘ā’. From Allah it means mercy, taken as its end (kindness), because real mercy is softness of the heart.","His name is not mentioned out of reverence; ‹من أرسله› points to him. ‘Sent’ is chosen because ‹رسالة› is above ‹نبوة›.","‹به الاقتداء يليق›: following him is what befits us; the fronting gives restriction compared with other prophets."],[["f",["‹نبي› = a prophet","‹رسول› = a prophet given a religion and a book","So ‘sent’ is the fuller title and implies the others"]]],"‘Take the ends and leave the beginnings’ when Allah’s mercy or anger is mentioned."],["Here the author blesses the family and companions and then moves into the book with ‹وبعد›.",["‹آل› comes from ‹أهل›. ‹أصحاب› is wider than ‹صحابة› (believers who met him and died as believers).","Only taṣdīq is mentioned in ‹بالتصديق› because it is the main route to knowledge.","‹وبعد› is built on ḍamma when what it is attached to is dropped but intended (like ‹قبل› and ‹فوق›).","‹فهذا›: the fā’ stands for an implied ‹أما›, and ‹هذا› points to what is present in the mind."],[["c",[["‹صدق›","The report matches reality"],["‹حق›","Reality matches the report"]]]],"Same match, seen from two sides."],["The title tells you what the book does: a refined text on logic and kalām.",["‹تحرير› = explaining without padding (‹حشو›) or excess.","‹المنطق› is a tool (‹آلة›): it stands between the mind and what it wants to learn, and guards it from error.","‹الكلام› = the science of the Origin and the Return on Islam’s lines. That phrase excludes philosophy.","‹سيما› comes from ‹لا سيما›. ‹قوام› = what he stands by, ‹عصام› = what protects him from slipping."],[["t","‹غاية تهذيب الكلام›",[["‹تحرير المنطق›","A tool that protects thinking"],["‹الكلام›","Origin and Return, per Islam"],["‹تقريب المرام›","Bring the aim close to understanding"]]]],"Logic is a tool; kalām is the aim."],["Part One is logic. The muqaddima is the introduction that must come first.",["‹القسم الأول› has ‹ال› because two parts were already implied; ‹مقدمة› has none because it is new.","‹مقدمة› is from ‹مقدمة الجيش› (the vanguard): a part placed before the aim because the aim depends on it.","The muqaddima explains three things (below).","The Tuḥfa counts 7 meanings of ‘Part One’ and 5 of ‘logic’: 35 combinations."],[["t","‹المقدمة›",[["1","Definition of logic"],["2","The need for it"],["3","Its subject"]]]],"First learn what, why, and about what."],["Knowledge splits into two kinds depending on whether the mind accepts a relation.",["‹العلم› = the form of a thing arriving in the mind. The author does not define it because it is well known.","Taṣdīq = accepting a relation (‘Zayd is standing’ or ‘is not standing’).","Taṣawwur = everything else: one thing, many things, an incomplete relation (‹غلام زيد›), a command (‹اضرب›), or doubt and suspicion.","Ḥukamā’: taṣdīq is the judgment itself. Al-Rāzī: it is a composite. The author follows the Ḥukamā’."],[["t","‹العلم›",[["‹تصديق›","Accepts a relation: ‘Zayd is standing’"],["‹تصور›","No acceptance: ‹زيد›, ‹غلام زيد›, ‹اضرب›, doubt"]]]],"Ask: did the mind accept a relation? Yes = taṣdīq; no = taṣawwur."],["Each kind of knowledge can arrive with no thinking, or only after thinking.",["‹ويقتسمان›: each of the two takes a share of ‹الضرورة› (no thought) and ‹الاكتساب› (by thought).","The author says this by implication, which is more eloquent than stating it.","‹بالضرورة› hints that the division is self-evident: look inside yourself and you find both kinds."],[["t","Knowledge",[["‹تصور›","Necessary: heat and cold. Acquired: angels and jinn"],["‹تصديق›","Necessary: fire burns. Acquired: the world is created, the Maker exists"]]]],"Both taṣawwur and taṣdīq have necessary and acquired parts."],["Thinking can go wrong, so we need a rule that protects it. That rule is logic.",["‹النظر› = the mind turning to what is known to reach the unknown. ‹المعقول› is said (not ‹المعلوم›) to avoid a homonym and to show it works on universals.","One thinker says the world is created, another says eternal; both cannot be right, so error is possible.","The need is proven by three premises (below).","‹القانون› = a universal rule giving rulings on its particulars, like ‘every doer is nominative’."],[["f",["Knowledge is taṣawwur or taṣdīq","Each is necessary or acquired by thought","Thought can make mistakes","So we need a rule that guards thought = LOGIC"]]],"Logic is the rule that protects thought from error."],["Every science has a subject. Logic’s subject is the known concepts and judgments that lead to something unknown.",["The subject = what the science studies for its essential accidents (‹العوارض الذاتية›).","An essential accident attaches to the thing itself or through something equal to it (wonder → laughter). A foreign accident attaches through something more general, more specific, or distinct (heat in water through fire).","Known concept leading to an unknown concept = ‹معرِّف›. Known judgment leading to an unknown judgment = ‹حجة› (it overcomes the opponent).","A known thing that leads nowhere, like Zayd and ‘Amr, is not the logician’s concern."],[["t","‹موضوع المنطق›",[["‹معرِّف›","‹الحيوان الناطق› leads to the concept ‘man’"],["‹حجة›","‘The world changes; every changing thing is created’ leads to ‘created’"]]]],"Logic studies what leads from the known to the unknown."]],"balaghah":[["Faṣāḥa is clarity of expression. It applies to a word, to speech, and to the speaker.",["Word: free of letter-clash, free of breaking morphology, and not strange.","Speech: free of word-clash, weak grammar and complexity, with eloquent words.","Speaker: a faculty to express any aim in eloquent speech.","Balāgha applies to speech and the speaker only, not to a single word."],[["t","‹الفصاحة›",[["‹الكلمة›","No clash, no deviation, no strangeness"],["‹الكلام›","+ no weak composition, no complexity"],["‹المتكلم›","A faculty of eloquent expression"]]]],"Balāgha = faṣāḥa + fitting the situation."],["A single word is faulty in exactly three ways.",["‹تنافر الحروف›: letters clash and the word is heavy on the tongue.","‹مخالفة القياس›: the word does not follow the morphological rule.","‹الغرابة›: the word’s meaning is not clear."],[["c",[["‹تنافر الحروف›","Heavy on the tongue"],["‹مخالفة القياس›","Breaks the ṣarf rule"],["‹الغرابة›","Meaning unclear"]]]],"Three word faults: sound, form, clarity."],["Speech is faulty when its composition or meaning is blocked.",["‹ضعف التأليف›: not following the well-known grammar rule.","‹التعقيد›: the intended meaning is hidden.","Complexity is ‹لفظي› (flaw in wording) or ‹معنوي› (flaw in the meaning link)."],[["t","‹التعقيد›",[["‹لفظي›","Flaw in the wording and order"],["‹معنوي›","Flaw in the link of meaning"]]]],"Complexity hides the meaning."],["Balāgha means matching what the situation calls for.",["‹الحال› (or ‹المقام›) = what moves the speaker to phrase it a certain way.","‹المقتضى› (the suitable consideration) = the form the phrase takes.","Example: praise calls for elaboration; a clever listener calls for brevity."],[["f",["‹الحال›: praise, or a clever listener","‹المقتضى›: elaboration, or brevity","Match + eloquence = ‹بلاغة›"]]],"Same words, different situations."],["Each fault is caught by a different science.",["A student needs language, ṣarf, naḥw, ma‘ānī and bayān, plus sound taste and wide reading of the Arabs."],[["c",[["‹مخالفة القياس›","الصرف"],["‹ضعف التأليف› and verbal ‹تعقيد›","النحو"],["‹الغرابة›","Wide reading of Arab speech"],["Semantic ‹تعقيد›","البيان"],["Situations and what they require","المعاني"]]]],"Match the fault to the science."],["‘Ilm al-ma‘ānī studies how speech fits the situation.",["Forms of speech differ because situations differ.","‘Ilm al-ma‘ānī = states of Arabic expression by which it fits the situation.","It differs from bayān and badī‘, which study other things."],[["f",["Situations differ","Forms of speech differ","‘Ilm al-ma‘ānī studies the forms that fit each situation"]]],"Ma‘ānī = fitting speech to the situation."],["All speech is either khabar or inshā’.",["‹خبر›: you can call the speaker truthful or lying.","‹إنشاء›: you cannot.","Inshā’ is requestive or not; the book skips the non-requestive kind because it is not a topic of ma‘ānī (exclamation, oath, contract wording)."],[["t","‹الكلام›",[["‹خبر›","Can be true or false"],["‹إنشاء›","Cannot be true or false"]]]],"Test: can it be called true or false?"],["Requestive inshā’ asks for something not yet obtained. It has five tools.",["‹الأمر› = seeking an action from a position of superiority (4 forms).","‹النداء› = seeking attention with a particle standing for ‹أدعو›.","The other three are on the next lesson."],[["t","‹الإنشاء الطلبي›",[["‹الأمر›","Seek an action, superior"],["‹النهي›","Seek refraining, superior"],["‹الاستفهام›","Seek knowledge"],["‹التمني›","Wish"],["‹النداء›","Seek attention"]]]],"Five tools: command, prohibition, question, wish, call."],["Prohibition and questions often mean something other than their plain sense.",["‹النهي› has one form: present tense with ‹لا› الناهية.","‹الاستفهام› = seeking knowledge; the hamza can seek taṣawwur or taṣdīq.","Commands, prohibitions and questions can shift to other purposes."],[["c",[["‹النهي› shifts to","دعاء، التماس، تمني، تهديد"],["‹الاستفهام› shifts to","تسوية، نفي"],["‹الأمر› shifts to","تعجيز، إهانة، إكرام، تخيير"]]]],"The context decides the purpose."],["Sometimes you mention a word, sometimes you drop it. Balāgha decides by situation.",["Omission is not just shortening: look at the benefit it brings.","Omission needs a clue showing what was dropped.","Ask these in order (below)."],[["f",["What does the situation call for?","Does omission bring a benefit?","Is there a clue to the dropped word?","If yes to both: omit. If not: mention it."]]],"Omit only with a benefit and a clue."]]};
const dg=d=>d[0]==='f'?`<div class="flow">${d[1].map((n,i)=>(i?'<div class="arrow">↓</div>':'')+`<div class="node">${fmt(n)}</div>`).join('')}</div>`:d[0]==='t'?`<div class="flow"><div class="node rootn">${fmt(d[1])}</div><div class="arrow">↓</div></div><div class="studygrid">${d[2].map(k=>`<div class="mini"><b>${fmt(k[0])}</b>${fmt(k[1])}</div>`).join('')}</div>`:`<div class="studygrid">${d[1].map(k=>`<div class="mini"><b>${fmt(k[0])}</b>${fmt(k[1])}</div>`).join('')}</div>`;

const TEACH_AR={"tahdhib":[["ابتدأ المصنف كتابه بالبسملة ثم الحمد، وبين الحديثين في الابتداء توفيق يزيل التعارض.",["حُذفت ألف «بسم» خطاً لكثرة الاستعمال، وطُوّلت الباء عوضاً عنها.","الحديث الأول: كل أمر ذي بال لا يُبدأ فيه باسم الله فهو أقطع. والثاني: كل كلام لا يُبدأ فيه بالحمد فهو أجذم.","الجمع: التسمية ابتداء حقيقي (لا شيء قبله)، والتحميد ابتداء إضافي أو عرفي (قبل المقصود).","الحمد: الثناء باللسان على الجميل الاختياري نعمة كان أو غيرها."],"كلا الحديثين محقق، لأن للابتداء معنيين."],["«الحمد لله» معناه: كل حمد مختص بالله، وفي الجملة دليلها.",["«الله» علم للذات الواجب الوجود المستجمع لجميع صفات الكمال.","«ال» في «الحمد» للاستغراق، واللام في «لله» للاختصاص.","الدليل: الحمد صفة كمال، وصفات الكمال منحصرة في المستجمع لها، وهي قضية فطرية قياسها معها كقولنا: الأربعة زوج.","لو كان «الله» اسماً للمفهوم الكلي لما أفاد «لا إله إلا الله» التوحيد، فهو علم لفرد موجود."],"دعوى معها برهانها."],["للهداية معنيان مشهوران، والمصنف يجعلها مشتركة بينهما.",["المعتزلة: الإيصال إلى المطلوب، فتختص بالمؤمنين.","الأشاعرة: إراءة الطريق، فتعم كل أحد.","كل قول ينقضه دليل: آية ثمود تنقض الإيصال، وآية «لا تهدي من أحببت» تنقض الإراءة؛ فالهداية مشتركة بينهما.","«سواء الطريق»: وسطه، كناية عن الطريق المستقيم، وفيه براعة استهلال."],"الهداية لفظ مشترك عند المصنف."],["ذكر المصنف نعمة التوفيق ثم الصلاة على النبي ﷺ.",["التوفيق: توجيه الأسباب نحو المطلوب الخير، وقيل: خلق القدرة على الطاعة.","الصلاة: الدعاء، وإذا نُسبت إلى الله فالمراد الرحمة أي غايتها وهي الإحسان، لأن الرحمة حقيقة رقة القلب.","لم يُذكر اسمه ﷺ تعظيماً، واختير «الإرسال» لأن الرسالة فوق النبوة.","«به الاقتداء يليق»: تقديم «به» للحصر بالنسبة إلى سائر الأنبياء."],"خذ الغايات واترك المبادئ."],["ثم صلى على الآل والأصحاب وانتقل إلى المقصود بـ«وبعد».",["«آل» أصله أهل، و«الأصحاب» أعم من «الصحابة» وهم المؤمنون الذين أدركوا صحبته ﷺ وماتوا على الإيمان.","ذُكر التصديق دون التصور لأنه الطريق الأعظم لكسب المعرفة.","«بعد» تُبنى على الضم إذا حُذف المضاف إليه ونُوي معناه، مثل قبل وفوق.","«فهذا»: الفاء من «أما» مقدرة، و«هذا» إشارة إلى الحاضر في الذهن."],"الصدق والحق: مطابقة من جهتين."],["العنوان يبين موضوع الكتاب: تهذيب علم المنطق والكلام.",["التحرير: التبيين خالياً عن الحشو والزوائد.","المنطق آلة قانونية تعصم الذهن عن الخطأ في الفكر.","الكلام: علم يبحث عن المبدأ والمعاد على نهج قانون الإسلام، وبهذا خرجت الفلسفة.","«سيما» أصلها «لا سيما»، والقوام ما يقوم به الشيء والعصام ما يحفظه."],"المنطق آلة، والكلام المقصد."],["القسم الأول في المنطق، والمقدمة تمهيد لا بد منه.",["عُرّف «القسم الأول» لأن القسمين عُلما ضمناً، ونُكّرت «مقدمة» لأنها لم تُذكر.","المقدمة من مقدمة الجيش: ما يتقدم المقصود لتوقفه عليه.","تبين المقدمة ثلاثة أمور: رسم المنطق والحاجة إليه وموضوعه.","في التحفة سبعة معانٍ للقسم الأول وخمسة للمنطق، فالاحتمالات خمسة وثلاثون."],"ما هو؟ ولماذا؟ وفيم يبحث؟"],["العلم قسمان بحسب الإذعان للنسبة.",["العلم: الصورة الحاصلة من الشيء عند العقل، ولم يعرفه المصنف لشهرته.","التصديق: إذعان للنسبة الخبرية، ثبوتية أو سلبية.","التصور: ما سواه، كالمفرد ونسبة غير تامة (غلام زيد) أو إنشائية (اضرب) أو الشك والوهم.","الحكماء: التصديق نفس الحكم، والرازي: مركب، واختار المصنف قول الحكماء."],"هل أذعن العقل للنسبة؟"],["كل من التصور والتصديق منه ضروري ومنه كسبي.",["«يقتسمان»: يأخذ كل منهما قسطاً من الضرورة والاكتساب.","أتى بذلك ضمناً وكناية وهو أبلغ من التصريح.","«بالضرورة»: القسمة بديهية، يجدها الإنسان في نفسه."],"لكل من التصور والتصديق ضروري وكسبي."],["الفكر قد يخطئ فنحتاج قانوناً يعصمه وهو المنطق.",["النظر: ملاحظة المعقول لتحصيل المجهول، وقال «المعقول» لدفع الاشتراك والتنبيه على الكليات.","قد يصل مفكر إلى حدوث العالم وآخر إلى قدمه، ولا يجتمعان، فالخطأ واقع.","تثبت الحاجة بثلاث مقدمات (في المخطط).","القانون: قضية كلية يتعرف منها أحكام جزئياتها، مثل: كل فاعل مرفوع."],"المنطق قانون يعصم الفكر عن الخطأ."],["موضوع كل علم ما يبحث فيه عن عوارضه الذاتية، وموضوع المنطق المعلوم الموصل إلى مجهول.",["العرض الذاتي: ما يعرض للشيء لذاته أو بواسطة أمر مساوٍ له.","العرض الغريب: ما يعرض بواسطة أمر أعم أو أخص أو مباين، كحرارة الماء بالنار.","المعلوم التصوري الموصل إلى تصور مجهول: معرِّف، والتصديقي الموصل إلى تصديق: حجة.","ما لا يوصل إلى مجهول، كزيد وعمرو، لا يب
