<main>
<h1>Islamic Text Study Course</h1>
<p class="sub">Switchable book-based study · each book keeps its own lessons, questions, definitions, and progress</p>
<div class="tabs"><button class="tab on" id="t1">Lessons</button><button class="tab" id="t2">Arabic review</button><button class="tab" id="t3">Definitions</button></div>
<div id="app"></div>

<script>
// Arabic is written between ‹ › and rendered in Arabic script.
// Each lesson: [title, [points], [[question, correct, [wrong, wrong]], ...]]
const L=[
["Preface 1: Basmala and ḥamd",["The ‹ب› of the basmala is written with no alif because of frequent use, and the bā’ is lengthened as compensation. ‘Umar b. ‘Abd al-‘Azīz told his scribe to lengthen the bā’, show the sīns, and round the mīm.","The author opens with ḥamd after the basmala, following the best speech (the Qur’an) and the Prophet’s ﷺ ḥadīth. The ‹قوله› of the commentary means ‘the saying of the speaker’; the speaker is implied, because a saying needs someone to say it.","Two ḥadīths: every important matter not begun with Allah’s name is ‹أقطع›, and every speech not begun with ḥamd is ‹أجذم›. Reconciliation: the basmala is the true beginning (‹حقيقي›: nothing precedes it); the ḥamd is a relative beginning (‹إضافي›: before the aim, though after other things) or customary (‹عرفي›).","‹الحمد›: praise by the tongue for a beautiful voluntary act, whether a favour (‹نعمة›) or another virtue (like first greeting with salām). ‹نعمة› with kasra means the act of favouring; with fatḥa, blessings; with ḍamma, delight."],[["How are the two ḥadīths about basmala and ḥamd reconciled according to the sharḥ?","Basmala is the true (ḥaqīqī) beginning; ḥamd is a relative (iḍāfī) or customary (‘urfī) beginning",["One ḥadīth is weak and rejected","Both ḥadīths refer only to the end of speech"]],["What is the precise definition of ‹الحمد› given in the sharḥ?","Praise by the tongue for a beautiful voluntary act, whether a favour or another virtue",["Praise by the heart for any quality, even involuntary","Thanks by the limbs for every action"]],["Why is the letter ‹ب› of the basmala written without an alif?","Because of frequent use; the bā’ is lengthened as compensation",["Because it is a preposition that never takes alif","Because ‘Umar ordered all bā’s to be written that way"]],["According to the sharḥ, what does ‹قوله› (‘his saying’) imply?","The speaker is understood, since a saying requires someone who says it",["It refers only to the author of the matn","It is a technical term for the Prophet’s speech"]]]],
["Preface 2: ‹الله› and the claim of ḥamd",["‹الله› is a proper name (‹علم›) on the sounder view. The disputes: Arabic, Hebrew or Syriac; name or attribute; derived or not. Bayḍāwī held it is an attribute that became dominant. The author: it names the Necessary Being who gathers all attributes of perfection.","‹ال› in ‹الحمد› gives all or the genus, and the ‹لام› of ‹لله› gives specification. So all ḥamd belongs only to the one gathering every perfection. This is a claim with its proof inside it, and the proposition is fiṭrī (its syllogism is with it, like ‘four is even’).","Shape of the proof (first figure): ḥamd is a perfection; perfections are restricted to the one who gathers all perfections. Restriction itself is a perfection, so denying it contradicts the premise.","‹الذات› here means the opposite of an attribute. ‹الواجب الوجود›: whose existence is necessary and nonexistence impossible. If ‹الله› were the universal meaning, ‘no god but Allah’ would not prove tawḥīd, so it must name the single existing individual."],[["What is the preferred view of the author regarding the word ‹الله›?","It is a proper name (ʿalam) for the Necessary Being who gathers all attributes of perfection",["It is only a predominant attribute (as Bayḍāwī held)","It is a universal concept restricted to one individual"]],["What does ‹الواجب الوجود› mean?","That whose existence is necessary and whose non-existence is impossible",["That whose existence is merely possible","That whose existence is unknown to us"]],["How does the lām in ‹لله› function in the claim ‘al-ḥamdu li-llāh’?","It gives specification (takhṣīṣ), restricting all ḥamd to Allah alone",["It is only for emphasis and has no meaning","It indicates the beginning of the speech"]],["Why must ‹الله› be a proper name of an individual rather than a universal concept?","Otherwise ‘lā ilāha illā Allāh’ would not prove tawḥīd",["Because the Arabs never used universal names","Because Bayḍāwī said so"]]]],
["Preface 3: Hidāya and the straight path",["Mu‘tazila: ‹هداية› is guidance that actually delivers to the goal (‹إيصال›). Ash‘aris: it is showing the way (‹إراءة الطريق›). The first implies arrival, so it is specific to believers; the second does not, so it is general.","Each is challenged by a verse: ‘As for Thamūd, We guided them but they preferred blindness’ refutes delivery; ‘You cannot guide whom you love’ refutes mere showing. The author (in his ḥāshiya on al-Kashshāf): ‹هداية› is a homonym covering both. It takes its object directly, with ‹إلى›, or with ‹لـ›.","‹سواء الطريق›: the middle of the road, a metonymy (‹كناية›) for the straight road, because the middle is closest to the goal. It can mean truth in general (covering logic and kalām, a ‹براعة الاستهلال›, an opening that hints at the contents) or Islam in particular.","Terms: ‹دين› (as obeyed), ‹ملة› (as dictated; only attributed to prophets and imams, never ‘milla of Allah’), ‹شرع› (as a watering place)."],[["What is the Ashʿarī understanding of ‹هداية›?","Showing the way (irā’at al-ṭarīq), without necessarily delivering to the goal",["Actually delivering the person to the goal","Creating faith in the heart"]],["What is ‹سواء الطريق› a metonymy (kināya) for?","The straight road, because the middle is closest to the goal",["A long and difficult road","The end of the road"]],["Why does the verse about Thamūd challenge the Muʿtazilī definition of hidāya?","It says ‘We guided them’ yet they preferred blindness, so guidance need not entail arrival",["It shows that only prophets receive guidance","It proves that guidance is only for the afterlife"]],["According to the author, ‹هداية› is best understood as:","A homonym that covers both ‘showing the way’ and ‘delivering to the goal’",["Only the Muʿtazilī sense","Only the Ashʿarī sense"]]]],
["Preface 4: Tawfīq and ṣalāt on the Prophet ﷺ",["‹التوفيق›: directing the causes toward a good goal. Views: creating the power to obey; creating the obedience itself; making the plan match the decree. Linguistically general, but by use it is only for good (‘tawfīq of prayer’, not ‘of theft’).","‹لنا› in ‹وجعل لنا› can attach to ‹جعل› (closer in wording) or to ‹رفيق› (closer in meaning). The ‹لام› expresses benefit, not purpose, since Allah’s acts are not caused by purposes.","‹الصلاة› is du‘ā’. When from Allah it means mercy, as a metaphor for mercy’s end (kindness), since true mercy is softness of heart. Likewise anger and vengeance: ‘take the ends, leave the beginnings’.","His name is not mentioned, out of reverence; ‹من› points to the perfect individual. ‹أرسله› is chosen because ‹رسالة› is above ‹نبوة› in rank (a rasūl is a prophet given a religion and a book). ‹هدى›, ‹نوراً›: guidance and light; the grammar allows ḥāl or reason, and ‹نور› may mean illuminating, illuminated, or metaphorical.","‹به الاقتداء يليق›: ‹به› belongs to ‹الاقتداء›, so following him befits us. The fronting gives restriction, relative to the other prophets (following the imams is following him)."],[["What does ‹الصلاة› from Allah mean according to the sharḥ?","Mercy, used metaphorically for its end-result (kindness)",["The ritual prayer with bowing and prostration","Fasting or any act of worship"]],["Why is ‹رسالة› ranked above ‹نبوة›?","A messenger (rasūl) is a prophet who is given a religion and a book",["Because there are more messengers than prophets","Because messengers lived later in time"]],["What is the linguistic meaning of ‹التوفيق›?","Directing the causes toward a good goal",["Creating the act of obedience itself only","Simply wishing good for someone"]],["In the phrase ‹به الاقتداء يليق›, what does the fronting of ‹به› indicate?","Restriction: following him (rather than other prophets) is what befits us",["That the Prophet is the only one who follows anyone","That the verb ‘yalīq’ must come first"]]]],
["Preface 5: Āl, aṣḥāb, ṣidq and ‹وبعد›",["‹آل› comes from ‹أهل› (diminutive ‹أهيل›) and is used for the honourable. The commentary’s author is Imāmī and so defines the Prophet’s āl as the infallible family; the footnote records other views. ‹أصحاب› is wider than ‹صحابة›, which is only for believers who met him ﷺ and died as believers.","‹مناهج› = clear paths. Truth from two sides: a report matching reality is ‹صدق›; reality matching the report is ‹حق›. Only taṣdīq is mentioned (not taṣawwur) because taṣdīq is the main route of acquiring knowledge. ‹صعدوا في معارج الحق› = reached its highest levels.","‹وبعد›: an adverb built on ḍamma because its muḍāf ilayh is dropped but intended. Words like this are ‹غايات› (qabl, ba‘d, taḥt, fawq, amām, warā’, khalf, asfal, dūn, awwal). Three states: mentioned; dropped and forgotten (declined); dropped but intended (built).","‹فهذا›: the ‹فاء› comes from an imagined or implied ‹أما›. ‹هذا› points to what is present in the mind: the words or the meanings. So ‹الكلام› is either ‹لفظي› (what is uttered) or ‹نفسي› (the mental form it matches)."],[["When are words such as ‹قبل› and ‹بعد› called ‹غايات› and built on ḍamma?","When their muḍāf ilayh is dropped but its meaning is still intended",["When they are used as verbs","When they are in the plural"]],["What is the difference between ‹صدق› and ‹حق›?","Ṣidq is a report matching reality; ḥaqq is reality matching the report",["They are exact synonyms with no difference","Ḥaqq is only used for religious truth"]],["How does the author of the sharḥ (being Imāmī) define the Prophet’s ‹آل›?","The infallible family (ʿitra maʿṣūma)",["Anyone who follows the Prophet’s religion","All the Arabs of Quraysh"]],["What does ‹هذا› in ‹فهذا› point to?","What is present in the mind — either the words or the meanings",["The physical printed book","The author of the commentary"]]]],
["Preface 6: The title and the dedication",["‹غاية تهذيب الكلام›: refinement of speech at its utmost. ‹في تحرير› (not ‹بيان›) hints at a statement free of padding (‹حشو›) and excess (‹زوائد›).","‹المنطق› is a canonical tool (‹آلة قانونية›): a tool stands between agent and its object; this one is between the intellect and acquired aims. It protects the mind from error when its rules are observed (like a saw cuts only when moved).","‹الكلام› is the science of the Origin and the Return in line with Islam’s canon. This phrase excludes philosophy, which also discusses the Origin but is not bound to the Sharī‘a.","‹وتقريب المرام من تقرير عقائد الإسلام›: bringing the aim near to understanding. The idāfa in ‹عقائد الإسلام› is a lāmiyya or explanatory depending on what Islam means: beliefs alone, tongue plus heart plus limbs, or the tongue alone (Karrāmiyya).","‹تبصرة› (insight for the beginner) and ‹تذكرة› (reminder), especially for ‹الولد الأعز› named ‹حبيب الله›. ‹الحفي› = affectionate, ‹الحري› = worthy, ‹قوام› = what he stands by, ‹عصام› = what protects from slipping. ‹التوكل› is clinging to truth and cutting off from creation. ‹سيما› is from ‹لا سيما›."],[["Why does the author say ‹في تحرير› rather than ‹في بيان›?","To hint that the explanation is free of padding (ḥashw) and excess (zawā’id)",["Because ‘taḥrīr’ means ‘very long’","Because it is a poetic expression"]],["How is ‹الكلام› defined so that it excludes philosophy?","It is the science of the Origin and the Return according to the Islamic canon",["It is concerned only with Arabic grammar","It is identical with logic"]],["What is the meaning of ‹التوكل› given in the dedication?","Clinging to the truth and cutting off dependence on creation",["Simply abandoning all worldly means","Seeking provision from people"]],["What does ‹سيما› originally come from?","«لَا سِيَّمَا» with the ‘lā’ dropped in pronunciation",["The word ‘sīm’ meaning ‘mark’","A verb meaning ‘to ask’"]]]],
["Muqaddima 1: Part One and the opening",["‹القسم الأول› is definite (lām al-‘ahd) because ‹المنطق والكلام› already implied two parts; ‹مقدمة› is indefinite, not mentioned before.","Objection: if Part One is just the logical issues, how does ‹في› mean ‘containing’? Answer: ‘Part One’ can mean the words and ‘logic’ the meanings, so ‘these words are explaining these meanings’.","The Tuḥfa: ‘Part One’ has 7 senses (words, meanings, inscriptions, and their combinations) and ‘logic’ has 5 (the faculty, knowing all the issues, knowing a sufficient amount, the issues themselves, the sufficient amount). That gives 35 combinations, in each of which a verb like explaining, acquiring, or occurring is understood as fits.","‹مقدمة› is from ‹مقدمة الجيش›: a portion put before the aim because it relates to and helps the aim. It explains three things: the definition (‹رسم›), the need, and the subject. If the book means words, the muqaddima is a body of words; if meanings, a body of meanings giving insight before starting."],[["What three things does the muqaddima explain?","The definition (rasm) of logic, the need for it, and its subject",["Its author, its price, and its length","Only its definition and nothing else"]],["From what expression is ‹مقدمة› derived?","‹مقدمة الجيش› (the advance-guard of an army)",["‹دم› (blood)","‹قانون› (rule)"]],["Why is ‹القسم الأول› definite while ‹مقدمة› is indefinite?","Because the two parts were already understood from ‘taḥrīr al-manṭiq wa-l-kalām’, unlike the muqaddima",["Because the muqaddima is longer","Because Part One was mentioned earlier by name"]],["How many combinations of meanings for ‘Part One’ and ‘logic’ does the Tuḥfa mention?","Thirty-five (7 × 5)",["Twelve","Seven"]]]],
["Muqaddima 2: Knowledge, taṣdīq and taṣawwur",["‹العلم›: the form of a thing arrived in the intellect. The author does not define it: either the taṣawwur by some route suffices for dividing, or its definition is famous, or it is self-evident.","‹إذعان للنسبة› = believing the relation, affirmative or negative (‘Zayd is standing’, ‘is not standing’). The author took the Ḥukamā’ view that taṣdīq is the judgment itself, not the composite with conceiving both sides (al-Rāzī). He also took the older view that the object of acceptance is the informative relation, not its ‘occurrence’, matching his later threefold division of a proposition.","Ḥukamā’: simple, conditioned on three things. Rāzī: composite. The Ḥukamā’ view is preferred: they divided knowledge into these two so each could have its own way of acquisition, and that only works if taṣdīq is the judgment alone.","‹وإلا فتصور›: whether grasping one thing (Zayd), several without a relation (Zayd and ‘Amr), an incomplete relation (‹غلام زيد›), a complete imperative relation (‹إضرب›), or an informative relation perceived without acceptance (imagining, doubting, suspecting)."],[["According to the author’s preferred view (the Ḥukamā’), what is taṣdīq?","The judgment / assent itself, not the composite of judgment plus concepts of the two sides",["The composite of judgment and the concepts of subject and predicate","Any mental form whatsoever"]],["What is an example of a relation that is only taṣawwur (not taṣdīq)?","An informative relation perceived without acceptance (e.g. doubt or mere imagination)",["Affirming that Zayd is standing","Denying that the world is eternal"]],["Why did the author not define ‹العلم› in the matn?","Either a partial conception is enough for division, or its definition is famous, or it is self-evident",["Because the word is not Arabic","Because logic has no need of the concept of knowledge"]],["What does ‹إذعان للنسبة› mean?","Believing / assenting to the affirmative or negative informative relation",["Simply conceiving the two terms without any judgment","Doubting whether the relation holds"]]]],
["Muqaddima 3: Iqtisām, ḍarūra and kasb",["‹ويقتسمان›: iqtisām is taking a share. Taṣawwur and taṣdīq share ‹الضرورة› (arrival without thought) and ‹الاكتساب› (arrival by thought): each takes a share of both, so each is partly necessary and partly acquired. Expressing it this way, through implication, is more eloquent than stating it outright.","Al-Asās treats ‘iqtasama’ as intransitive, but the commentary prefers it transitive (‘they divide necessity and acquisition’), so no preposition is assumed.","‹بالضرورة› hints that this division is self-evident, with no need for the proof the earlier scholars used: by introspection we find concepts we have with no thought (heat and cold) and others by thought (the reality of angels and jinn).","Likewise for judgments: with no thought (the sun is bright, fire burns) and by thought (the world is created, the Maker exists). The reasoning is: in the stage of the faculty itself there is no acquisition yet, so the first knowledge arrives without it."],[["Why is it self-evident that both taṣawwur and taṣdīq have necessary and acquired parts?","Introspection finds clear examples of each (e.g. heat/cold vs. the reality of angels)",["Because logic formally proves it","Because Arabic grammar requires it"]],["What does ‹ويقتسمان› express by implication?","That each of taṣawwur and taṣdīq shares both necessity and acquisition",["That taṣawwur is only necessary","That taṣdīq is only acquired"]],["Give an example of a necessary (ḍarūrī) judgment mentioned in the sharḥ.","The sun is bright / fire burns",["The world is originated","The Maker exists"]],["What is the difference between ḍarūra and iktisāb?","Ḍarūra is arrival of knowledge without thought; iktisāb is arrival by means of thought",["Ḍarūra is only for taṣdīq; iktisāb is only for taṣawwur","There is no real difference"]]]],
["Muqaddima 4: Naẓar and the need for logic",["‹النظر›: the soul turning to a known matter to obtain an unknown one. ‹المعقول› instead of ‹المعلوم›: avoids the homonym, shows thought works on universals (a particular neither acquires nor is acquired), and keeps the rhyme.","Error occurs: one thought reaches ‘the world is created’, another ‘the world is eternal’. One must be wrong, or contradictories would meet. So a universal rule is needed which, if observed, prevents error. That is logic.","The need is proved by three premises: (1) knowledge is taṣawwur or taṣdīq; (2) each is either obtained without thought or by it; (3) thought can err. Together these show people need a rule guarding thought, and so logic’s definition is known: a rule whose observance guards the mind from error in thought.","‹القانون› is a Greek or Syriac word for a ruler used for lines. In usage it is a universal proposition from which rulings on its particulars are known, like ‘every doer is nominative’, which governs ‘Zayd stood’, ‘‘Amr sat’, and thousands more."],[["What are the three premises that prove the need for logic?","Knowledge is taṣawwur or taṣdīq; each is necessary or acquired; thought can err",["More books are needed; a new language is required; people are weak","Logic is Greek; the Arabs need it; it is difficult"]],["What is the technical meaning of ‹القانون› in logic?","A universal proposition from which the rulings on its particulars are known",["A single concrete example","A word of praise for a scholar"]],["Why did the author choose ‹المعقول› instead of ‹المعلوم› when defining naẓar?","To avoid the homonym, to show that thought works on universals, and to keep the rhyme",["Because ‘maʿqūl’ is shorter","Because ‘maʿlūm’ is not Arabic"]],["What is the definition of ‹النظر› given in the matn?","The soul’s turning to a known matter in order to obtain an unknown one",["Simply conceiving particulars","Making any judgment at all"]]]],
["Muqaddima 5: The subject of logic",["The subject (‹موضوع›) of a science is what is investigated about its essential accidents (‹العوارض الذاتية›). It need not be the only subject of every question, only what they all revolve around.","Essential accident: what attaches (1) to the thing itself (wonder in man as man), or (2) through something equal to it (laughter through wonder). Foreign accidents (‹غريبة›) attach through something more general, more specific, or distinct (heat in water through fire or the sun).","Only essential accidents are sought, because the aim is to show the subject’s own conditions. A foreign accident is truly a condition of something else, and is investigated in that science.","Subject of logic: the known taṣawwur insofar as it leads to an unknown concept (‹معرِّف›, like ‹الحيوان الناطق› leading to man) and the known taṣdīq insofar as it leads to an unknown judgment (‹حجة›). A known concept that leads nowhere, like particulars Zayd and ‘Amr, is not studied by the logician.","They are named ‹معرف› (it identifies the unknown) and ‹حجة› (it overcomes the opponent; ‹الحجة› means overcoming). Naming the cause by the effect."],[["What attaches through something more general, more specific, or distinct?","Foreign accidents (ʿawāriḍ gharība)",["Essential accidents only","The subject of the science itself"]],["What is the subject of logic?","The known concept (taṣawwur) and known judgment (taṣdīq) insofar as they lead to an unknown concept or judgment",["Words only","Particular individuals such as Zayd and ʿAmr"]],["Why is a known concept that leads to no unknown concept not studied by the logician?","Because it is not a muʿarrif; the logician studies only what leads to the unknown",["Because it is the main subject of logic","Because it is a ḥujja"]],["What is an essential accident (ʿaraḍ dhātī)?","What attaches to the thing itself or through something equal to it",["What attaches only through a more general thing","Any quality that can leave the subject"]]]],
["Dalāla (signification)",[
"‹الدلالة›: a thing such that knowing it brings knowledge of another. The first is ‹الدال›, the second ‹المدلول›.",
"Six kinds: verbal or non-verbal, each by convention (‹وضعية›: the word Zayd), nature (‹طبعية›: a cough for chest pain), or reason (‹عقلية›: smoke for fire).",
"Only verbal conventional signification is studied, because communication depends on it. It is three: ‹مطابقة› (the whole meaning), ‹تضمن› (a part), ‹التزام› (a necessary external).",
"Iltizām needs a mental necessity, rational (sight for blindness) or customary (generosity for ‹حاتم›). The author takes the customary view too.",
"Muṭābaqa always accompanies the other two (even if only in estimation), not the reverse: a word may have a simple meaning with no part and no necessary companion."],
[["‹man› signifying ‹rational animal›:","Muṭābaqa",["Taḍammun","Iltizām"]],
 ["‹Ḥātim› signifying generosity is:","Iltizām by custom",["Taḍammun","Natural signification"]]]],
["Mufrad and murakkab",[
"A word is ‹مركب› only if four conditions hold: the word has parts; its meaning has parts; a part of the word signifies a part of the meaning; and that is intended. Lose any one and it is ‹مفرد›.",
"Four kinds of mufrad: no parts in the word (hamzat al-istifhām); no parts in the meaning (‹الله›); no signification of parts (‹زيد›); signification not intended (‹الحيوان الناطق› used as a personal name).",
"Murakkab tāmm can be left at silence (‹زيد قائم›): khabar (true or false) or inshā’. Murakkab nāqiṣ: taqyīdī (‹غلام زيد›) or other (‹في الدار›).",
"Independent mufrad whose form indicates a tense is ‹كلمة› (fi‘l in grammar); without tense it is ‹اسم›; not independent it is ‹أداة› (ḥarf)."],
[["‹الله› is mufrad because:","Its meaning has no parts",["It has no letters","It is a verb"]],
 ["‹في الدار› is:","Murakkab nāqiṣ, not taqyīdī",["Murakkab tāmm","Mufrad kalima"]]]],
["One meaning or many",[
"One meaning: specified by convention ‹علم›; otherwise ‹متواطئ› if instances are equal (man), ‹مشكك› if they differ by priority, precedence, or degree (existence; whiteness in snow vs ivory).",
"Many meanings: ‹مشترك› if set separately for each (‹عين›: eye, gold, spring); ‹منقول› if it became famous in the second meaning (named after the transferer: sharī‘a, custom, or a technical field); otherwise ‹حقيقة› in the first and ‹مجاز› in the second.",
"Demonstratives like ‹هذا› have a general placement but particular meaning; on the author's view they are not ‹علم›."],
[["‹عين› (eye, gold, spring) is:","Mushtarak",["Mutawāṭi’","Manqūl"]],
 ["A word whose instances differ in priority is:","Mushakkik",["Mutawāṭi’","‘Alam"]]]],
["Universals, particulars and their relations",[
"‹جزئي›: its being said of many is impossible (Zayd). ‹كلي›: possible. A universal may have impossible instances, possible but none existing (the phoenix ‹العنقاء›), one existing with others possible (the sun), and so on.",
"Between two universals: ‹تباين› (no overlap); ‹تساوٍ› (overlap fully both sides, e.g. man/rational); ‹عموم وخصوص مطلق› (one side only, animal/man); ‹عموم وخصوص من وجه› (partial overlap, animal/white).",
"Their opposites: of equals, equal; of absolute general/specific, reversed; of partial overlap, partial disjoint (‹تباين جزئي›).",
"‹الجزئي الإضافي›: what is more specific than something else, so it can itself be a universal."],
[["Animal and white are related by:","General-specific from one aspect (min wajh)",["Equality","Total disjointness"]],
 ["The phoenix (‹العنقاء›) is a universal that is:","Possible but nonexistent",["Impossible","Existing once"]]]],
["The five universals",[
"‹الجنس›: said of many differing in reality, in answer to “what is it?”. Near (animal for man) or far (growing body). ‹النوع›: said of many agreeing in reality, same question.",
"Orders: the highest genus (substance) ‹جنس الأجناس›; the lowest species ‹نوع الأنواع›; in between, intermediates.",
"‹الفصل›: in answer to “which thing is it in itself?”. ‹مقوِّم› relative to what it constitutes; ‹مقسِّم› relative to what it divides. A constituent of the higher is a constituent of the lower, not the reverse; the divider is the opposite.",
"‹الخاصة›: external, said of one reality only (walker is a property of animal, a general accident of man). ‹العرض العام›: said of it and others.",
"Khātima: the concept ‘universal’ is ‹كلي منطقي›; its instance (man) is ‹طبعي›; the combination is ‹عقلي›. The natural universal exists as its individuals exist."],
[["The differentia answers:","Which thing is it in itself?",["What is it?","Does it exist?"]],
 ["A constituent of the higher genus is:","Also a constituent of the lower",["Never of the lower","A divider of the lower"]]]],
["Definition (ta‘rīf)",[
"‹المعرِّف› is what is said of a thing to give its concept. It must be equal to it and clearer: not by something more general, more specific, equally known or unknown, or more obscure.",
"Using the near differentia is ‹حد›; using the property is ‹رسم›. With the near genus it is complete (‹تام›), otherwise incomplete (‹ناقص›). General accidents are not counted.",
"A verbal definition (‹لفظي›) just explains what a word means, and may be more general."],
[["Definition by near genus + near differentia:","Complete ḥadd",["Incomplete rasm","Verbal definition"]],
 ["Definition by the property is:","Rasm",["Ḥadd","Qiyās"]]]],
["Propositions (qaḍāyā)",[
"‹القضية›: a statement that can be true or false. Ḥamliyya (affirmative or negative): subject, predicate, copula (‹هو› borrowed). Otherwise shartiyya: antecedent ‹مقدم› and consequent ‹تالٍ›.",
"By the subject: ‹شخصية› (a specific individual), ‹طبعية› (the reality itself), ‹محصورة› (quantified, universal or particular, with a ‹سور›), ‹مهملة› (unquantified, equivalent to particular).",
"An affirmative needs an existing subject: ‹خارجية› (actual), ‹حقيقية› (supposed), ‹ذهنية› (mental). ‹معدولة› if the negation is part of the predicate; else ‹محصلة›.",
"‹موجهة› states the mode of the relation (necessary, perpetual, actual, possible...). Combining with ‹لا دوام› or ‹لا ضرورة› gives the composites (e.g. ‹المشروطة الخاصة›, ‹الممكنة الخاصة›)."],
[["An unquantified proposition is:","Muhmala",["Shakhṣiyya","Mu‘dūla"]],
 ["The two parts of a conditional are:","Muqaddam and tālī",["Subject and predicate","Major and minor"]]]],
["Conditionals, contradiction, conversion",[
"‹متصلة›: relation holds on the supposition of another; ‹لزومية› if through a link (‹علاقة›), else ‹اتفاقية›. ‹منفصلة›: ḥaqīqiyya (cannot both be true or both false), ‹مانعة الجمع› (not both true), ‹مانعة الخلو› (not both false).",
"‹التناقض›: two statements such that the truth of each implies the falsity of the other. They must differ in quantity, quality, and mode, and agree in everything else.",
"Contradictories: necessary → possible general; perpetual → absolute general; ‹المشروطة العامة› → ‹الحينية الممكنة›; ‹العرفية العامة› → ‹الحينية المطلقة›.",
"‹العكس المستوي›: swap the two terms keeping truth and quality. Universal affirmative → particular affirmative; universal negative → universal negative; particular negative has no conversion.",
"‹عكس النقيض›: replace the terms with their contradictories (swapped); the rulings for affirmatives and negatives are exchanged compared to ‹المستوي›."],
[["A universal affirmative converts (simple conversion) to:","A particular affirmative",["A universal affirmative","A universal negative"]],
 ["A ‹مانعة الخلو› forbids:","Both parts being false",["Both parts being true","Either part being true"]]]],
["The syllogism (qiyās) and induction",[
"‹القياس›: statements from which another statement necessarily follows. If the conclusion (matter and form) is stated inside, it is ‹استثنائي›; otherwise ‹اقتراني›.",
"Terms: ‹أصغر› (subject of conclusion), ‹أكبر› (predicate), ‹أوسط› (repeated). ‹صغرى› has the minor, ‹كبرى› the major. Four figures by the middle term: predicate/subject (1st), predicate/predicate (2nd), subject/subject (3rd), reverse of the first (4th).",
"The first figure is called ‘first’ because its productivity is self-evident; the others are theoretical and are returned to it. Its conditions: minor affirmative (and actual), major universal. Second: premises differ in quality, major universal. Third: minor affirmative, one premise universal.",
"Istithnā’ī: from a ‹متصلة›, affirming the antecedent affirms the consequent and denying the consequent denies the antecedent. From a ḥaqīqiyya, affirming either denies the other and vice versa.",
"‹الاستقراء›: surveying particulars to prove a universal ruling. ‹التمثيل›: a particular shares another’s ground (‘illa), so the ruling transfers; the main tools are ‹الدوران› and ‹الترديد›."],
[["The middle term is the predicate of the minor and subject of the major in:","The first figure",["The second","The third"]],
 ["Affirming the antecedent of a conditional proves:","The consequent",["The negation of the antecedent","Nothing"]]]],
["Kinds of syllogism by matter",[
"‹البرهاني›: built from certainties (‹اليقينيات›). ‹الجدلي›: from ‹المشهورات› (matching the opinions of all, like the goodness of kindness, or of one group) and ‹المسلمات› (conceded by the opponent in debate, or proven in one science and assumed in another).",
"‹الخطابي›: from ‹المقبولات› (taken from someone trusted, like saints and sages) and ‹المظنونات›. ‹الشعري›: from imaginative statements.",
"‹السفسطي›: from ‹الوهميات› and ‹المشبهات›, i.e. false statements that resemble true primary ones. The name comes from ‹سفسطة› (Greek ‹سوفا اسطا›)."],
[["A syllogism built from ‹المسلمات› and ‹المشهورات› is:","Jadalī",["Burhānī","Safsaṭī"]],
 ["‹المشبهات› are:","False statements resembling true primary ones",["Certain premises","Statements taken from a saint"]]]],
["Khātima 1: the parts of a science",[
"Every science has three parts: ‹الموضوعات› (subjects, whose essential accidents are sought), ‹المبادئ› (clear or accepted premises on which the science’s syllogisms rest), and ‹المسائل› (the statements sought in the science).",
"The subject of a question is the subject of the science, a type of it, an essential accident of it, or a composite. Its predicate is something external to it that attaches to it for its own sake.",
"Another usage (Ibn al-Ḥājib): ‹المبادئ› is whatever is begun with before the aims. If inside the science (conceiving the subject, essential accidents, premises) it is ‹مبادئ› proper. If outside but needed to begin, even loosely (knowing the definition, aim, subject), it is ‹مقدمات›.",
"So ‹المبادئ› is more general than ‹المقدمات› (Tuḥfa). Example of an accident that is essential only in a wide sense: ‹كل فلك يمتنع عليه الخرق›."],
[["The three parts of a science are:","Subjects, principles, questions",["Genus, species, differentia","Subject, predicate, copula"]],
 ["In Ibn al-Ḥājib’s usage, what is needed from outside the science to begin is called:","‹مقدمات›",["‹مسائل›","‹موضوعات›"]]]],
["Khātima 2: the eight heads (al-ru’ūs al-thamāniya)",[
"1. ‹الغرض› (aim): what motivated the first compiler. ‹الغرض› is the result that moves the agent; ‹المنفعة› is a result that arises regardless. The aim of logic is protection from error in thought.",
"2. ‹المنفعة› (benefit): what all people naturally desire, so the student is eager and bears the effort. 3. ‹السمة› (title): the label that gives a summary of what follows; ‹المنطق› covers outer speech and inner perception of universals, and this science strengthens the first and guides the second.",
"4. ‹المؤلف› (author): to settle the student’s heart; but the sharh adds ‘look at what was said, not who said it’. Aristotle compiled it by order of Alexander (the ‘First Teacher’); al-Fārābī is the ‘Second Teacher’.",
"5. Which science it belongs to (rational or transmitted; practical covers ethics, household management, civic politics; logic is a tool of theoretical wisdom). 6. Its rank: when to study it. The Tuḥfa suggests Qur’an, then ṣarf and naḥw, then basic fiqh and ḥadīth, then logic.",
"7. ‹القسمة والتبويب› (division): logic’s classic nine chapters are Isāghūjī (the five universals), definitions, propositions, syllogism, burhān, jadal, khiṭāba, mughālaṭa, shi‘r. This book: muqaddima, two maqṣads (taṣawwurāt, taṣdīqāt), khātima. 8. ‹الأنحاء التعليمية›: the teaching methods (next lesson)."],
[["‹الغرض› differs from ‹المنفعة› in that ‹الغرض› is:","The result that motivates the agent",["Any result at all","The title of the book"]],
 ["The aim of logic, per the sharh, is:","Protection from error in thought",["Protection from error in speech","Beauty of expression"]]]],
["Khātima 3: the four teaching methods",[
"‹التقسيم› (division, also called composing the syllogism): for a goal that is a judgment, set its two terms, gather everything each is said of and everything said of it, and find a middle link between them. It is also described as multiplying premises from the conclusion upward.",
"‹التحليل› is the reverse: take a given argument and trace it back to learn its form. If a premise shares both parts of the goal it is istithnā’ī; if one part, iqtirānī. The part shared with the goal’s subject is the minor, with the predicate the major. Also: analysing Zayd to man to rational animal.",
"‹التحديد› (making definitions): set the thing aside, gather everything more general than it, separate the essentials (what removing would remove the quiddity) from accidents, gather what is equal to it to tell genus from general accident and differentia from property, then build the kind of definition you want.",
"‹البرهان›: the path to certainty (and, for practical sciences, to action). Use the six necessary kinds of premise (‹الضروريات الستة›) or what follows from them in a valid form, and investigate thoroughly so nothing merely resembling them slips in."],
[["The method that traces an argument back to learn its figure is:","Taḥlīl",["Taqsīm","Taḥdīd"]],
 ["Taḥdīd is the method of:","Making definitions",["Making syllogisms","Dividing the book"]]]]
];

const DEF=[["الْحَمْدُ","الثَّنَاءُ بِاللِّسَانِ عَلَى الْجَمِيلِ الِاخْتِيَارِيِّ نِعْمَةً كَانَ أَوْ غَيْرَهَا","Praise by the tongue for a beautiful voluntary act, whether a favour (niʿma) or another virtue."],["الله","علم على الأصح للذات الواجب الوجود المستجمع لجميع صفات الكمال","Most correctly a proper name for the Necessary Being who gathers all attributes of perfection."],["الواجب الوجود","ما يكون وجوده ضرورياً وعدمه ممتنعاً","That whose existence is necessary and whose non-existence is impossible."],["الهداية","مشترك بين إراءة الطريق والإيصال إلى المطلوب","A homonym covering both ‘showing the way’ and ‘delivering to the goal’."],["سواء الطريق","وسط الطريق كناية عن الطريق المستوي","The middle of the road, a metonymy for the straight road."],["التَّوْفِيقُ","تَوْجِيهُ الْأَسْبَابِ نَحْوَ الْمَطْلُوبِ الْخَيْرِ","Directing the causes toward a good goal."],["الصلاة من الله","الرحمة مجازاً عن غايتها وهي الإحسان","Mercy, used metaphorically for its end-result (kindness)."],["الرسالة","فوق النبوة، وهي النبوة مع الكتاب والشريعة","Above prophethood; it is prophethood together with a book and a revealed law."],["آل النبي","عند الشارح: عترته المعصومون","According to the commentator: his infallible family."],["الأصحاب","أعم من الصحابة، والصحابة من آمن به ولقيه ومات على الإيمان","Wider than ṣaḥāba; ṣaḥāba are those who believed in him, met him, and died as believers."],["الصِّدْقُ","مُطَابَقَةُ الْخَبَرِ لِلْوَاقِعِ","A report’s matching of reality."],["الْحَقُّ","مُطَابَقَةُ الْوَاقِعِ لِلْخَبَرِ","Reality’s matching of the report."],["الغايات","ظروف مبنية على الضم إذا حذف المضاف إليه ونوي معناه مثل قبل وبعد","Adverbs built on ḍamma when their muḍāf ilayh is dropped but intended (e.g. qabl, baʿd)."],["وبعد","ظرف مبني على الضم لحذف المضاف إليه مع نية معناه","An adverb built on ḍamma because its governed noun is dropped while its meaning is intended."],["الْمَنْطِقُ","آلَةٌ قَانُونِيَّةٌ تَعْصِمُ مُرَاعَاتُهَا الذِّهْنَ عَنِ الْخَطَأِ فِي الْفِكْرِ","A canonical tool whose observance protects the mind from error in thought."],["الكلام","علم يبحث عن المبدأ والمعاد على قانون الإسلام","The science that investigates the Origin and the Return according to the Islamic canon."],["المقدمة","من مقدمة الجيش: ما يقدم أمام المقصود لارتباطه به","From ‘the army’s advance-guard’: what is placed before the aim because it is related to it."],["العلم","الصورة الحاصلة من الشيء عند العقل","The form of a thing as it is present in the intellect."],["التَّصْدِيقُ","إِذْعَانٌ لِلنِّسْبَةِ الْخَبَرِيَّةِ الثُّبُوتِيَّةِ أَوِ السَّلْبِيَّةِ","Assent to an affirmative or negative informative relation."],["التَّصَوُّرُ","الْعِلْمُ إِنْ لَمْ يَكُنْ إِذْعَانًا لِلنِّسْبَةِ","Knowledge that is not assent to a relation."],["الضرورة","حصول العلم بلا نظر","Arrival of knowledge without thought / reflection."],["الِاكْتِسَابُ","حُصُولُ الْعِلْمِ بِالنَّظَرِ","Arrival of knowledge by means of thought / reflection."],["النَّظَرُ","تَوَجُّهُ النَّفْسِ نَحْوَ الْأَمْرِ الْمَعْلُومِ لِتَحْصِيلِ أَمْرٍ مَجْهُولٍ","The soul’s turning toward a known matter in order to obtain an unknown one."],["الْقَانُونُ","قَضِيَّةٌ كُلِّيَّةٌ يُتَعَرَّفُ مِنْهَا أَحْكَامُ جُزْئِيَّاتِهَا","A universal proposition from which the rulings of its particulars are known."],["مَوْضُوعُ الْعِلْمِ","مَا يُبْحَثُ فِي الْعِلْمِ عَنْ عَوَارِضِهِ الذَّاتِيَّةِ","That about whose essential accidents the science investigates."],["الْعَرَضُ الذَّاتِيُّ","مَا يَعْرِضُ لِلشَّيْءِ أَوَّلًا وَبِالذَّاتِ أَوْ بِوَاسِطَةِ أَمْرٍ مُسَاوٍ لَهُ","What attaches to a thing primarily and by itself, or through something equal to it."],["العرض الغريب","ما يعرض بواسطة أمر أعم أو أخص أو مباين","What attaches through something more general, more specific, or distinct."],["الْمُعَرِّفُ","الْمَعْلُومُ التَّصَوُّرِيُّ مِنْ حَيْثُ إِنَّهُ يُوصِلُ إِلَى مَطْلُوبٍ تَصَوُّرِيٍّ","The known concept insofar as it leads to an unknown concept."],["الْحُجَّةُ","الْمَعْلُومُ التَّصْدِيقِيُّ مِنْ حَيْثُ إِنَّهُ يُوصِلُ إِلَى مَطْلُوبٍ تَصْدِيقِيٍّ","The known judgment insofar as it leads to an unknown judgment."],["براعة الاستهلال","كون ديباجة الكتاب مناسبة للمقصود","An opening that hints at the contents of the book."],["التَّصْدِيقُ","الْعِلْمُ إِنْ كَانَ إِذْعَانًا لِلنِّسْبَةِ","Knowledge that is acceptance of a relation."],["التَّصَوُّرُ","الْعِلْمُ إِنْ لَمْ يَكُنْ إِذْعَانًا لِلنِّسْبَةِ","Knowledge that is not acceptance of a relation."],["النَّظَرُ","مُلَاحَظَةُ الْمَعْقُولِ لِتَحْصِيلِ الْمَجْهُولِ","Turning the mind to what is known in order to obtain the unknown."],["الْمَنْطِقُ","قَانُونٌ يَعْصِمُ مُرَاعَاتُهُ الذِّهْنَ عَنِ الْخَطَأِ فِي الْفِكْرِ","A rule whose observance protects the mind from error in thought."],["مَوْضُوعُ الْمَنْطِقِ","الْمَعْلُومُ التَّصَوُّرِيُّ وَالتَّصْدِيقِيُّ مِنْ حَيْثُ إِنَّهُ يُوصِلُ إِلَى مَطْلُوبٍ تَصَوُّرِيٍّ أَوْ تَصْدِيقِيٍّ","The known concept and judgment insofar as they lead to an unknown concept or judgment."],["الْمُعَرِّفُ","الْمَعْلُومُ التَّصَوُّرِيُّ مِنْ حَيْثُ إِنَّهُ يُوصِلُ إِلَى مَطْلُوبٍ تَصَوُّرِيٍّ","The known concept insofar as it leads to an unknown concept."],["الْحُجَّةُ","الْمَعْلُومُ التَّصْدِيقِيُّ مِنْ حَيْثُ إِنَّهُ يُوصِلُ إِلَى مَطْلُوبٍ تَصْدِيقِيٍّ","The known judgment insofar as it leads to an unknown judgment."],["الْقَانُونُ","قَضِيَّةٌ كُلِّيَّةٌ يُتَعَرَّفُ مِنْهَا أَحْكَامُ جُزْئِيَّاتِ مَوْضُوعِهَا","A universal proposition from which the rulings on its particulars are known."],["الدَّلَالَةُ","كَوْنُ الشَّيْءِ بِحَيْثُ يَلْزَمُ مِنَ الْعِلْمِ بِهِ الْعِلْمُ بِشَيْءٍ آخَرَ","A thing being such that knowing it brings knowledge of another."],["الْمُطَابَقَةُ","دَلَالَةُ اللَّفْظِ عَلَى تَمَامِ مَا وُضِعَ لَهُ","A word signifying the whole of what it was set for."],["التَّضَمُّنُ","دَلَالَةُ اللَّفْظِ عَلَى جُزْءِ مَا وُضِعَ لَهُ","A word signifying a part of what it was set for."],["الِالْتِزَامُ","دَلَالَةُ اللَّفْظِ عَلَى الْخَارِجِ عَنْ مَعْنَاهُ، وَلَا بُدَّ فِيهِ مِنَ اللُّزُومِ عَقْلًا أَوْ عُرْفًا","A word signifying something outside its meaning, requiring necessity by reason or custom."],["الْمُرَكَّبُ","الْمَوْضُوعُ إِنْ قُصِدَ بِجُزْئِهِ الدَّلَالَةُ عَلَى جُزْءِ مَعْنَاهُ","A word whose part is intended to signify a part of its meaning."],["الْمُفْرَدُ","الْمَوْضُوعُ الَّذِي لَمْ يُقْصَدْ بِجُزْئِهِ الدَّلَالَةُ عَلَى جُزْءِ مَعْنَاهُ","A word whose part is not intended to signify a part of its meaning."],["الْمُرَكَّبُ التَّامُّ","مَا يَصِحُّ السُّكُوتُ عَلَيْهِ","What one may stop at (complete utterance)."],["الْخَبَرُ","الْمُرَكَّبُ التَّامُّ الَّذِي يَحْتَمِلُ الصِّدْقَ وَالْكَذِبَ","A complete utterance that can be true or false."],["الْإِنْشَاءُ","الْمُرَكَّبُ التَّامُّ الَّذِي لَا يَحْتَمِلُ الصِّدْقَ وَالْكَذِبَ","A complete utterance that cannot be true or false."],["الْمُرَكَّبُ النَّاقِصُ","مَا لَا يَصِحُّ السُّكُوتُ عَلَيْهِ","What one may not stop at (incomplete utterance)."],["التقييدي","المركب الناقص الذي جزؤه الثاني قيد للأول","An incomplete composite whose second part qualifies the first."],["الكلمة","المفرد المستقل مع الدلالة بهيئته على أحد الأزمنة الثلاثة","An independent single word whose form indicates one of the three tenses."],["الاسم","المفرد المستقل بدون الدلالة بهيئته على أحد الأزمنة الثلاثة","An independent single word with no tense in its form."],["الأداة","المفرد الذي لا يستقل بالدلالة على معناه","A single word that is not independent in signifying its meaning."],["العَلَم","المفرد المتحد المعنى مع تشخصه وضعاً","A single word of one meaning, individuated by its setting."],["المتواطئ","المفرد المتحد المعنى بدون تشخص إن تساوت أفراده","A single word of one meaning whose instances are equal."],["المشكك","المفرد المتحد المعنى بدون تشخص إن تفاوتت أفراده بأولية أو أولوية","A single word of one meaning whose instances differ by priority or precedence."],["المشترك","المفرد الكثير المعنى إن وضع لكل ابتداء","A word of many meanings set for each one originally."],["المنقول","المفرد الكثير المعنى إن اشتهر في الثاني","A word of many meanings that became famous in the second meaning."],["الحقيقة","اللفظ المستعمل في المعنى الموضوع له","A word used in the meaning it was set for."],["المجاز","اللفظ المستعمل في غير المعنى الموضوع له","A word used in a meaning it was not set for."],["الجزئي","المفهوم الذي امتنع فرض صدقه على كثيرين","A concept that cannot be supposed true of many."],["الكلي","المفهوم الذي لم يمتنع فرض صدقه على كثيرين","A concept that can be supposed true of many."],["المتباينان","الكليان إن تفرقا كلياً","Two universals that are completely separate."],["المتساويان","الكليان إن تصادقا كلياً من الجانبين","Two universals that fully coincide from both sides."],["الأعم والأخص مطلقاً","الكليان إن تصادقا كلياً من جانب واحد","Two universals that fully coincide from one side only."],["العموم والخصوص من وجه","الكليان إن لم يتصادقا كلياً من جانب ولا جانبين","Two universals that coincide only in part."],["الجنس","المقول على كثيرين مختلفين بالحقائق في جواب ما هو؟","What is said of many differing in reality, in answer to ‘what is it?’."],["الجنس القريب","ما كان الجواب عن الماهية وعن بعض مشاركتها هو الجواب عنها وعن الكل","A genus whose answer for the thing and for some of its sharers is the answer for all of them."],["الجنس البعيد","ما لم يكن الجواب عن الماهية وعن بعض مشاركتها هو الجواب عنها وعن الكل","A genus that is not so (far genus), like growing body."],["النوع","المقول على كثيرين متفقين بالحقائق في جواب ما هو؟","What is said of many agreeing in reality, in answer to ‘what is it?’."],["الفصل","المقول على الشيء في جواب أي شيء هو في ذاته؟","What is said of a thing in answer to ‘which thing is it in itself?’."],["الفصل القريب","ما ميز الشيء عن المشاركات في الجنس القريب","A differentia that distinguishes the thing from those sharing its near genus."],["المقوِّم","الفصل إذا نسب إلى ما يميزه","A differentia, when related to what it distinguishes (constituent)."],["المقسِّم","الفصل إذا نسب إلى ما يميزه عنه","A differentia, when related to what it distinguishes it from (divider)."],["الخاصة","الخارج المقول على ما تحت حقيقة واحدة فقط","An external attribute said of what falls under one reality only."],["العرض العام","الخارج المقول على الحقيقة وعلى غيرها","An external attribute said of that reality and of others."],["اللازم","ما امتنع انفكاكه عن الشيء","What cannot be separated from the thing."],["اللازم البيّن","ما يلزم تصوره من تصور الملزوم أو من تصورهما الجزم باللزوم","A necessary attribute whose concept follows from conceiving the thing (or both) with certainty of the link."],["العرض المفارق","ما لم يمتنع انفكاكه عن الشيء، يدوم أو يزول بسرعة أو بطء","What can be separated from the thing; it lasts or goes quickly or slowly."],["الكلي المنطقي","مفهوم الكلي","The concept ‘universal’ itself."],["الكلي الطبعي","معروض مفهوم الكلي","What the concept ‘universal’ is applied to (e.g. man)."],["الكلي العقلي","مجموع الكلي المنطقي ومعروضه","The combination of both."],["المعرِّف (التعريف)","ما يقال على الشيء لإفادة تصوره","What is said of a thing to give its concept."],["الحد","التعريف بالفصل القريب","Definition by the near differentia."],["الرسم","التعريف بالخاصة","Definition by the property."],["التعريف التام","ما كان مع الجنس القريب","A definition that includes the near genus."],["التعريف الناقص","ما كان بدون الجنس القريب","A definition without the near genus."],["التعريف اللفظي","ما يصدق به تفسير مدلول اللفظ","What explains the meaning of a word."],["القضية","قول يحتمل الصدق والكذب","A statement that can be true or false."],["الحملية","القضية التي الحكم فيها بثبوت شيء لشيء أو نفيه عنه","A proposition judging that one thing is or is not another."],["الموضوع","المحكوم عليه","The subject: what is judged."],["المحمول","المحكوم به","The predicate: what is judged of it."],["الرابطة","الدال على النسبة","The copula: what signals the relation."],["الشرطية","القضية التي ليست حملية","A proposition that is not categorical (conditional)."],["المقدم والتالي","الجزء الأول مقدم والجزء الثاني تالٍ","The first part is the antecedent; the second is the consequent."],["الشخصية","القضية التي موضوعها شخص معين","A proposition whose subject is a specific individual."],["الطبيعية","القضية التي موضوعها نفس الحقيقة","A proposition whose subject is the reality itself."],["المحصورة","القضية التي بين فيها كمية أفراد الموضوع كلاً أو بعضاً","A proposition stating how many of the subject’s instances (all or some)."],["السور","ما به البيان","The quantifier: what makes the quantity clear."],["المهملة","القضية التي لم تبين فيها كمية الأفراد","A proposition with no stated quantity."],["الخارجية","الموجبة التي موضوعها محقق الوجود","Affirmative whose subject actually exists."],["الحقيقية","الموجبة التي موضوعها مقدر الوجود","Affirmative whose subject is supposed to exist."],["الذهنية","الموجبة التي موضوعها موجود في الذهن","Affirmative whose subject exists in the mind."],["المعدولة","القضية التي جعل فيها حرف السلب جزءاً من جزء","A proposition where the negative particle is part of a part."],["الموجهة","القضية التي صرح فيها بكيفية النسبة","A proposition that states the mode of the relation."],["المتصلة","الشرطية التي حكم فيها بثبوت نسبة على تقدير أخرى أو نفيها","A conditional that judges a relation holds (or not) on supposing another."],["اللزومية","المتصلة التي كان الحكم فيها بعلاقة","A connected conditional based on a real link."],["الاتفاقية","المتصلة التي ليس الحكم فيها بعلاقة","A connected conditional by mere coincidence."],["المنفصلة","الشرطية التي حكم فيها بتنافي النسبتين أو عدم تنافيهما","A conditional that judges the two relations exclude (or not) each other."],["مانعة الجمع","المنفصلة التي حكم فيها بتنافي النسبتين صدقاً فقط","A disjunctive that forbids both being true only."],["مانعة الخلو","المنفصلة التي حكم فيها بتنافي النسبتين كذباً فقط","A disjunctive that forbids both being false only."],["التناقض","اختلاف القضيتين بحيث يلزم لذاته من صدق كل كذب الأخرى أو بالعكس","Two propositions differing such that the truth of each necessarily means the falsity of the other."],["العكس المستوي","تبديل طرفي القضية مع بقاء الصدق والكيف","Swapping the two terms while keeping truth and quality."],["عكس النقيض","تبديل نقيضي الطرفين مع بقاء الصدق والكيف","Swapping the contradictories of the two terms while keeping truth and quality."],["القياس","قول مؤلف من قضايا يلزم لذاته قول آخر","A statement composed of propositions from which another necessarily follows."],["الاستثنائي","القياس الذي ذكرت نتيجته أو نقيضها فيه بمادتها وهيئتها","A syllogism containing the conclusion (or its opposite) in matter and form."],["الاقتراني","القياس الذي لم تذكر فيه النتيجة ولا نقيضها بمادتها وهيئتها","A syllogism where it does not appear that way."],["الأصغر","موضوع المطلوب من القياس الحملي","The subject of the conclusion."],["الأكبر","محمول المطلوب من القياس الحملي","The predicate of the conclusion."],["الأوسط","الحد المتكرر في المقدمتين","The term repeated in both premises."],["الصغرى","المقدمة التي فيها الأصغر","The premise containing the minor term."],["الكبرى","المقدمة التي فيها الأكبر","The premise containing the major term."],["الشكل الأول","ما كان الأوسط فيه محمول الصغرى وموضوع الكبرى","The middle is predicate of the minor and subject of the major."],["الشكل الثاني","ما كان الأوسط فيه محمولاً في المقدمتين","The middle is the predicate in both premises."],["الشكل الثالث","ما كان الأوسط فيه موضوعاً في المقدمتين","The middle is the subject in both premises."],["الشكل الرابع","ما كان الأوسط فيه موضوع الصغرى ومحمول الكبرى","The reverse of the first: subject of the minor, predicate of the major."],["قياس الخلف","ما يقصد به إثبات المطلوب بإبطال نقيضه","A syllogism that proves the aim by refuting its contradictory."],["الاستقراء","تصفح الجزئيات لإثبات حكم كلي","Surveying particulars to prove a universal ruling."],["التمثيل","بيان مشاركة جزئي لآخر في علة الحكم ليثبت فيه","Showing one particular shares another’s ground, so the ruling transfers."],["البرهاني","القياس الذي يتألف من اليقينيات","A syllogism composed of certainties."],["الجدلي","القياس الذي يتألف من المشهورات والمسلمات","A syllogism from commonly held and conceded premises."],["الخطابي","القياس الذي يتألف من المقبولات والمظنونات","A syllogism from accepted and presumed premises."],["الشعري","القياس الذي يتألف من المخيلات","A syllogism from imaginative premises."],["السفسطي","القياس الذي يتألف من الوهميات والمشبهات","A syllogism from delusive and deceptively similar premises."],["الموضوعات","التي يطلب في العلم عن أعراضها الذاتية","What the science investigates for its essential accidents."],["المبادئ","حدود الموضوعات وأجزائها وأعراضها ومقدمات بينة أو مأخوذة يبتني عليها قياسات العلم","The definitions of the subjects, their parts and accidents, and the clear or assumed premises the science’s syllogisms rest on."],["المسائل","قضايا تطلب في العلم","The propositions sought in the science."],["الأنحاء التعليمية","التقسيم والتحليل والتحديد والبرهان","The teaching methods: division, analysis, defining, demonstration."],["الْعِلْمُ (تَعْرِيفُ الشَّارِحِ)","الصُّورَةُ الْحَاصِلَةُ مِنَ الشَّيْءِ عِنْدَ الْعَقْلِ","The form of a thing that arrives in the intellect."],["الْحَمْدُ","الثَّنَاءُ بِاللِّسَانِ عَلَى الْجَمِيلِ الِاخْتِيَارِيِّ نِعْمَةً كَانَ أَوْ غَيْرَهَا","Praise by the tongue for a beautiful voluntary act, a favour or otherwise."],["الْهِدَايَةُ (عِنْدَ الْمُعْتَزِلَةِ)","الْإِيصَالُ إِلَى الْمَطْلُوبِ","Guidance as delivering to the goal."],["الْهِدَايَةُ (عِنْدَ الْأَشَاعِرَةِ)","إِرَادَةُ الطَّرِيقِ الْمُوصِلِ إِلَى الْمَطْلُوبِ","Guidance as showing the way that leads to the goal."],["التَّوْفِيقُ","تَوْجِيهُ الْأَسْبَابِ نَحْوَ الْمَطْلُوبِ الْخَيْرِ","Directing the causes toward a good goal."],["الصَّلَاةُ","الدُّعَاءُ أَيْ طَلَبُ الرَّحْمَةِ","Du‘ā’, i.e. asking for mercy."],["الصَّحَابِيُّ","الْمُؤْمِنُ الَّذِي أَدْرَكَ صُحْبَةَ النَّبِيِّ عَلَيْهِ السَّلَامُ مَعَ الْإِيمَانِ","A believer who met the Prophet ﷺ and stayed a believer."],["الصِّدْقُ","الْخَبَرُ أَوِ الِاعْتِقَادُ مِنْ حَيْثُ إِنَّهُ مُطَابِقٌ لِلْوَاقِعِ","A report or belief insofar as it matches reality."],["الْحَقُّ","الْخَبَرُ أَوِ الِاعْتِقَادُ مِنْ حَيْثُ إِنَّ الْوَاقِعَ مُطَابِقٌ لَهُ","A report or belief insofar as reality matches it."],["الْكَلَامُ اللَّفْظِيُّ","مَا يَتَلَفَّظُ بِهِ الْإِنْسَانُ","What a person utters."],["الْكَلَامُ النَّفْسِيُّ","مَا يَتَصَوَّرُهُ فِي الذِّهْنِ وَيَأْتِي بِالْكَلَامِ اللَّفْظِيِّ عَلَى طِبْقِهِ","What he conceives in the mind and then utters in matching words."],["التَّحْرِيرُ","التَّبْيِينُ بَيَانًا خَالِيًا عَنِ الْحَشْوِ وَالزَّوَائِدِ","Explaining free of padding and excess."],["الْحَشْوُ","زَائِدٌ مُعَيَّنٌ بِلَا فَائِدَةٍ مُسْتَغْنًى عَنْهُ","A specific addition with no benefit, dispensable."],["الْآلَةُ","الْوَاسِطَةُ بَيْنَ الْفَاعِلِ وَمُنْفَعِلِهِ فِي وُصُولِ أَثَرِهِ إِلَيْهِ","The intermediary between agent and object by which its effect reaches it."],["عِلْمُ الْكَلَامِ","الْعِلْمُ الْبَاحِثُ عَنْ أَحْوَالِ الْمَبْدَأِ وَالْمَعَادِ عَلَى نَهْجِ قَانُونِ الْإِسْلَامِ","The science of the Origin and the Return, following Islam’s canon."],["السَّجْعُ","تَوَاطُؤُ الْفَاصِلَتَيْنِ مِنَ النَّثْرِ عَلَى حَرْفٍ وَاحِدٍ فِي الْآخِرِ","Two prose clauses agreeing on one final letter."],["الْإِذْعَانُ","اعْتِقَادُ النِّسْبَةِ الْخَبَرِيَّةِ الثُّبُوتِيَّةِ أَوِ السَّلْبِيَّةِ","Believing the informative relation, affirmative or negative."],["الِاعْتِقَادُ","رَبْطُ الْقَلْبِ بِشَيْءٍ مُطَابِقٍ لِلْوَاقِعِ أَوْ لَا","Binding the heart to something, matching reality or not."],["الضرورة (الحصول)","الحصول بلا نظر","Arriving without thought."],["الِاكْتِسَابُ","الْحُصُولُ بِالنَّظَرِ","Arriving by thought."],["مَوْضُوعُ الْعِلْمِ","مَا يُبْحَثُ فِيهِ عَنْ عَوَارِضِهِ الذَّاتِيَّةِ","What is investigated for its essential accidents."],["الْعَرَضُ الذَّاتِيُّ","مَا يَعْرِضُ لِلشَّيْءِ أَوَّلًا وَبِالذَّاتِ أَوْ بِوَاسِطَةِ أَمْرٍ مُسَاوٍ لَهُ","What attaches to a thing by itself or through something equal to it."],["الدال والمدلول","الدال ما يلزم من العلم به العلم بشيء آخر والمدلول ذلك الشيء الآخر","The signifier gives knowledge of another; that other is the signified."],["الدلالة الوضعية","ما كانت بسبب وضع الواضع وتعيينه الأول بإزاء الثاني","Signification by the setter assigning the first for the second."],["الدلالة الطبعية","ما كانت بسبب اقتضاء الطبع حدوث الدال عند عروض المدلول","Signification by nature’s tendency for the signifier to occur with the signified."],["الدلالة العقلية","ما كانت بسبب أمر غير الوضع والطبع","Signification by something other than convention or nature."],["اللزوم الذهني","كون الأمر الخارج بحيث يستحيل تصور الموضوع له بدونه","The external thing being such that the word’s meaning cannot be conceived without it."],["الاستقلال","الدلالة على المعنى بدون الاحتياج إلى ضم ضميمة","Signifying a meaning without needing anything added."],["جنس الأجناس","الجنس العالي الذي لا جنس فوقه كالجوهر","The highest genus, with none above it, like substance."],["النوع الإضافي","الماهية المقول عليها وعلى غيرها الجنس في جواب ما هو؟","A quiddity of which, and of others, a genus is said in answer to ‘what is it?’."],["الجزئي الإضافي","الأخص من شيء وهو أعم","What is more specific than something yet is itself general."],["التباين الجزئي","صدق كل من الكليين بدون الآخر في الجملة","Each of two universals being true without the other in some cases."],["الفرق بين الضرورة والدوام","الضرورة استحالة انفكاك شيء عن شيء والدوام عدم انفكاكه عنه","Necessity is impossibility of separation; perpetuity is non-separation."],["الصدق والكذب","الصدق المطابقة للواقع والكذب اللامطابقة له","Truth is matching reality; falsity is not matching it."],["الضرورية المطلقة","القضية التي حكم فيها بضرورة النسبة مادام ذات الموضوع موجودة","Necessity of the relation as long as the subject’s essence exists."],["المشروطة العامة","القضية التي حكم فيها بضرورة النسبة مادام وصف الموضوع","Necessity of the relation as long as the subject’s description holds."],["الوقتية المطلقة","القضية التي حكم فيها بضرورة النسبة في وقت معين","Necessity of the relation at a specific time."],["المنتشرة المطلقة","القضية التي حكم فيها بضرورة النسبة في وقت غير معين","Necessity of the relation at some unspecified time."],["الدائمة المطلقة","القضية التي حكم فيها بدوام النسبة مادام الذات","Perpetuity of the relation as long as the essence exists."],["العرفية العامة","القضية التي حكم فيها بدوام النسبة مادام الوصف","Perpetuity of the relation as long as the description holds."],["المطلقة العامة","القضية التي حكم فيها بفعلية النسبة","The relation is actual."],["الممكنة العامة","القضية التي حكم فيها بعدم ضرورة خلاف النسبة","The opposite of the relation is not necessary."],["المشروطة الخاصة","المشروطة العامة المقيدة باللادوام الذاتي","The general conditional necessary, qualified by non-perpetuity of essence."],["الوجودية اللاضرورية","المطلقة العامة المقيدة باللاضرورة الذاتية","The general absolute qualified by non-necessity of essence."],["الوجودية اللادائمة","المطلقة العامة المقيدة باللادوام الذاتي","The general absolute qualified by non-perpetuity of essence."],["الممكنة الخاصة","الممكنة العامة المقيدة باللاضرورة من الجانب الموافق","The general possible qualified by non-necessity of the agreeing side."],["العلاقة","أمر بسببه يستصحب المقدم التالي","A thing by which the antecedent brings the consequent with it."],["العنادية","المنفصلة التي كان التنافي فيها لذاتي الجزئين","A disjunctive whose exclusion comes from the two parts’ own natures."],["اللمي","القياس الذي كان الأوسط فيه علة للنسبة في الذهن وفي الواقع","A syllogism whose middle is the cause of the relation in the mind and in reality."],["الإني","القياس الذي كان الأوسط فيه علة للنسبة في الذهن فقط","A syllogism whose middle is the cause only in the mind."],["الفطريات","القضية التي قياسها معها","A proposition whose proof is with it, like ‘four is even’."],["المشهورات","القضايا التي يطابق فيها آراء الكل أو آراء طائفة","Propositions matching the opinions of all, or of one group."],["المسلمات","القضايا التي سلمت من الخصم في المناظرة أو برهن عليها في علم وأخذت في علم آخر","Propositions conceded by the opponent, or proven in one science and assumed in another."],["المقبولات","القضايا التي تؤخذ ممن يعتقد فيه","Propositions taken from someone one trusts."],["المشبهات","القضايا الكاذبة الشبيهة بالصادقة الأولية","False propositions resembling true primary ones."],["الغرض","ما يترتب على الفعل وكان باعثاً للفاعل على صدوره","The result that moved the agent to act."],["المنفعة","ما يترتب على الفعل وليس باعثاً للفاعل","A result of the act that did not move the agent."],["السمة","عنوان العلم ليكون عنده إجمال ما يفصله","The science’s title, giving a summary of what is detailed."],["المقدمات","ما يتوقف عليه الشروع بوجه البصيرة وفرط الرغبة كتعريف العلم وبيان غايته وموضوعه","What starting depends on, for insight and keenness, such as the definition, aim and subject."],["التقسيم (التعليمي)","الكثير من فوق","Multiplying from above."],["التحليل","عكس التقسيم","The reverse of taqsīm."],["التحديد","فعل الحد","The act of defining."],["البرهان (التعليمي)","الطريق إلى الوقوف على الحق والعمل به","The way to arrive at the truth and act on it."]];

const BALAGHAH=[["مقدمة: الفصاحة والبلاغة",["الفصاحة في اللغة تنبئ عن البيان والظهور، وتقع اصطلاحاً وصفاً للكلمة والكلام والمتكلم.","فصاحة الكلمة سلامتها من تنافر الحروف ومخالفة القياس والغرابة.","فصاحة الكلام سلامته من تنافر الكلمات وضعف التأليف والتعقيد مع فصاحة كلماته.","فصاحة المتكلم ملكة يقتدر بها على التعبير عن المقصود بكلام فصيح في أي غرض كان.","البلاغة في اللغة الوصول والانتهاء، واصطلاحاً تقع وصفاً للكلام والمتكلم."],[["فصاحة الكلمة سلامتها من:","تنافر الحروف ومخالفة القياس والغرابة",["القصر والوصل والفصل","الجناس والسجع"]],["فصاحة المتكلم هي:","ملكة يقتدر بها على التعبير عن المقصود بكلام فصيح في أي غرض كان",["سلامة اللفظ من الغرابة فقط","مطابقة الكلام للوزن فقط"]],["الفصاحة في اللغة تنبئ عن:","البيان والظهور",["الوصول والانتهاء","الحسن والزينة"]],["تقع البلاغة اصطلاحاً وصفاً لـ:","الكلام والمتكلم دون الكلمة",["الكلمة والكلام والمتكلم","الكلمة والكلام فقط"]],["البلاغة في اللغة:","الوصول والانتهاء",["البيان والظهور","الحسن والزينة"]]]],["مقدمة: التنافر ومخالفة القياس والغرابة",["تنافر الحروف يوجب ثقل الكلمة على اللسان وعسر النطق بها.","مخالفة القياس كون الكلمة غير جارية على القانون الصرفي، مع التفصيل في الشواذ المستثناة.","الغرابة كون الكلمة غير ظاهرة الدلالة على المعنى الموضوع له."],[["تنافر الحروف يوجب:","الثقل على اللسان وعسر النطق بها",["خفاء المعنى بسبب المجاز","مخالفة القانون النحوي"]],["الغرابة هي:","كون الكلمة غير ظاهرة الدلالة على المعنى الموضوع له",["كونها غير جارية على القانون الصرفي","كون حروفها متنافرة"]],["مخالفة القياس هي كون الكلمة:","غير جارية على القانون الصرفي",["غير ظاهرة الدلالة على المعنى","ثقيلة على اللسان عسيرة النطق"]],["ثقل الكلمة على اللسان سببه:","تنافر الحروف",["مخالفة القياس","الغرابة"]]]],["مقدمة: التعقيد وفصاحة الكلام والمتكلم",["فصاحة الكلام سلامته من تنافر الكلمات مجتمعة وضعف التأليف والتعقيد مع فصاحة كلماته.","ضعف التأليف كون الكلام غير جار على القانون النحوي المشهور مع كونه مما جوزه بعض أهل النظر.","التعقيد خفاء الدلالة على المعنى المراد، وهو لفظي بسبب خلل في اللفظ أو معنوي بسبب خلل في جهة المعنى."],[["التعقيد ينقسم إلى:","
